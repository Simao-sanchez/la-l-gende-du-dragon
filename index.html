<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veillée – prototype survivor</title>
<style>
:root{
  --bg:#ece7f2; --ink:#1f1a2b; --card:#ffffff; --muted:#6b6280; --accent:#7a3cc9; --line:#d6cde3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#120e1b;--ink:#f0eaf7;--card:#1e1830;--muted:#a79bc0;--accent:#b88af0;--line:#3a2f55}
}
:root[data-theme="dark"]{--bg:#120e1b;--ink:#f0eaf7;--card:#1e1830;--muted:#a79bc0;--accent:#b88af0;--line:#3a2f55}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#game{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.6);padding:16px;box-sizing:border-box}
#ov[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;width:100%;box-sizing:border-box}
.card h1,.card h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:1.7rem}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.5}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 18px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.card{max-height:100%;overflow:auto}
button:disabled{opacity:.5;cursor:default}
.card.wide{max-width:600px}
[data-k]:focus-visible{outline:2px solid var(--accent)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.opt:hover{border-color:var(--accent)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas><div id="ov"></div></div>
<script>
// ====== Mise en place du canvas ======
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), ov = document.getElementById("ov");
let W = 0, H = 0;
function resize(){ const r = cv.parentElement.getBoundingClientRect(); W = cv.width = r.width; H = cv.height = r.height; }
addEventListener("resize", resize); resize();

// ====== Contrôles : clavier (ZQSD / WASD / flèches) et glisser du doigt ======
const keys = {};
addEventListener("keydown", e => { const k = e.key.toLowerCase(); keys[k] = true; if (k.startsWith("arrow")) e.preventDefault(); });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
let stick = null, dashReq = false;
cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect();
  if (g && g.dashOn && Math.hypot(e.clientX - r.left - (W - 50), e.clientY - r.top - (H - 50)) < 42) { dashReq = true; return; } /* bouton de dash */ stick = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, x: 0, y: 0, l: r.left, t: r.top }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!stick || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.l - stick.ox, dy = e.clientY - stick.t - stick.oy;
  const d = Math.hypot(dx, dy), m = 50;
  if (d > m) { dx = dx / d * m; dy = dy / d * m; }
  stick.x = dx / m; stick.y = dy / m;
});
["pointerup", "pointercancel"].forEach(n => cv.addEventListener(n, e => { if (stick && e.pointerId === stick.id) stick = null; }));

// ====== Équipements : raretés, emplacements, tirage ======
const RAR = [ // la position dans la liste est l’identifiant stocké dans la base : ne pas réordonner
  // ord = ordre d’affichage, m = puissance des bonus, fxp = chance d’avoir un pouvoir spécial
  { n: "Commun", c: "#b8b8c8", m: 1, ord: 0, fxp: 0.15 },
  { n: "Rare", c: "#5ab0ff", m: 1.6, ord: 2, fxp: 1 },
  { n: "Épique", c: "#b66bff", m: 2.5, ord: 3, fxp: 1 },
  { n: "Légendaire", c: "#ffb13b", m: 4, ord: 4, fxp: 1 },
  { n: "Peu commun", c: "#6fd36f", m: 1.3, ord: 1, fxp: 0.6 }
];
const RAR_C = RAR.map(r => r.c);
// Pouvoirs spéciaux que certains équipements donnent en plus de leurs bonus (l = niveau du pouvoir, selon la rareté)
const EFFECTS = {
  ls: { n: "Vol de vie", d: "soigne 4 % des dégâts infligés", f: (g, l) => { g.ls += 0.04 * l; } },
  boom: { n: "Flèches explosives", d: "les projectiles explosent en zone à l’impact", f: (g, l) => { g.boom += l; } },
  flame: { n: "Terre brûlée", d: "les zones magiques laissent des flammes", f: (g, l) => { g.flame += l; } },
  pierce: { n: "Traversée", d: "les tirs percent un ennemi de plus", f: (g, l) => { g.w.pierce += l; } },
  multi: { n: "Tir multiple", d: "un projectile ou une zone de plus", f: g => { g.w.count++; } },
  reach: { n: "Grande allonge", d: "+25 % de portée du coup d’épée et des zones", f: g => { g.w.radius *= 1.25; } },
  regen: { n: "Régénération", d: "récupère 1 PV par seconde", f: (g, l) => { g.regen += l; } },
  dash: { n: "Dash", d: "Espace, Maj ou bouton DASH : ruée invincible, recharge 4 s", f: (g, l) => { g.dashOn = true; g.dashCd *= Math.pow(0.8, l - 1); } },
  orb: { n: "Orbe gardienne", d: "une orbe tourne autour de toi et blesse les ennemis", f: (g, l) => { g.w.orbs += l; } }
};
const SLOTS = { // fx = pouvoirs possibles pour cet emplacement
  arme: { l: "Arme", base: 8, u: " % de dégâts", names: ["Dague", "Épée", "Faux", "Arbalète"], st: "dmg", fx: ["ls", "boom", "flame", "pierce", "multi", "reach"] },
  armure: { l: "Armure", base: 8, u: " PV", names: ["Gilet", "Cotte de mailles", "Cuirasse"], st: "hp", fx: ["regen"] },
  bottes: { l: "Bottes", base: 4, u: " % de vitesse", names: ["Sandales", "Bottes", "Jambières"], st: "speed", fx: ["dash"] },
  amulette: { l: "Amulette", base: 25, u: " px de portée de ramassage", names: ["Médaillon", "Talisman", "Croc"], st: "mag", fx: ["orb"] }
};
const EPITHET = ["de fortune", "d’argent", "de la nuit", "du roi vampire", "de chasseur"];
function rollItem(boss) { // la rareté dépend du niveau (LEVELS.loot) : monstres d’un côté, boss de l’autre
  const table = boss ? g.lv.loot.boss : g.lv.loot.mob;
  let x = Math.random() * table.reduce((a, [, w]) => a + w, 0), r = table[0][0];
  for (const [id, w] of table) { r = id; if (x < w) break; x -= w; }
  const slot = Object.keys(SLOTS)[Math.floor(Math.random() * 4)], S = SLOTS[slot], R = RAR[r];
  const val = Math.round(S.base * R.m * (0.9 + Math.random() * 0.2));
  const it = { kind: slot, r, st: S.st, val, name: S.names[Math.floor(Math.random() * S.names.length)] + " " + EPITHET[r] };
  if (Math.random() < R.fxp) { it.fx = S.fx[Math.floor(Math.random() * S.fx.length)]; it.fl = Math.max(1, R.ord); } // pouvoir spécial
  return it;
}
let lootP = Promise.resolve();
function saveLoot() { // enregistre dans la base les objets trouvés pendant la partie
  if (!g.found.length) return;
  const rows = g.found.map(it => ({ player_id: me, kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }));
  lootP = sb("/items", "POST", rows, "return=representation").then(r => { inv.push(...r); }).catch(() => {});
}


// ====== État du jeu ======
// ====== Connexion à Supabase (base de données en ligne) ======
const SB_URL = "https://dzfuhtcblzaygssydtbv.supabase.co/rest/v1";
const SB_KEY = "sb_publishable_vSFxEvXCbP55trZHchKeoQ_SDma64LB"; // clé publique, faite pour être visible
async function sb(path, method, body, prefer) {
  const h = { apikey: SB_KEY, "Content-Type": "application/json" };
  if (prefer || method === "PATCH") h.Prefer = prefer || "return=minimal";
  const r = await fetch(SB_URL + path, { method: method || "GET", keepalive: !!method && method !== "GET", headers: h, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return method === "PATCH" || method === "DELETE" || prefer === "return=minimal" ? null : r.json();
}
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// Données du joueur actif (chargées depuis la base)
let me = -1, meName = "", bank = 0, stats = {}, players = [], inv = [], frag = 0, cityRow = null; // inv = équipements, frag = fragments de boss, cityRow = état du camp
let town = { forge: 0, auberge: 0, ecuries: 0, biblio: 0 };
let saveTimer = null;
function saveRemote(now) { // enregistre éclats, ville et statistiques
  clearTimeout(saveTimer);
  const go = () => { stats.frag = frag; return sb("/players?id=eq." + me, "PATCH", { shards: bank, town, stats, updated_at: new Date().toISOString() }).catch(() => {}); };
  if (now) return go();
  saveTimer = setTimeout(go, 1500);
}
const saveBank = () => saveRemote(false);
const saveTown = () => saveRemote(true);
addEventListener("pagehide", () => { if (me >= 0) saveRemote(true); });

async function loadProfile(i) {
  const rows = await sb("/players?id=eq." + i + "&select=*");
  if (!rows[0]) throw new Error("profil introuvable");
  me = i; meName = rows[0].name; bank = rows[0].shards; stats = rows[0].stats || {};
  frag = stats.frag || 0;
  town = Object.assign({ maison: 0 }, rows[0].town);
  if (!town.maison && town.auberge) town.maison = town.auberge; // l’ancien niveau « auberge » devient celui de la maison
  inv = await sb("/items?player_id=eq." + i + "&select=*&order=id");
  try { await loadCity(); } catch (e) {}
  try { localStorage.setItem("veillee_dernier", i); } catch (e) {} // le navigateur retient le dernier joueur
}
function endRun(ok) { // ok = évacuation réussie ; sinon le joueur est mort
  stats.parties = (stats.parties || 0) + 1;
  stats.victimes = (stats.victimes || 0) + g.kills;
  stats.meilleurTemps = Math.max(stats.meilleurTemps || 0, Math.floor(g.t));
  
  if (ok) { // le butin n’est gardé que si on sort vivant
    stats.evacuations = (stats.evacuations || 0) + 1;
    bank += g.run; frag += g.runF; saveLoot();
  } else loseGear();
  saveRemote(true);
}
function loseGear() { // mort : le butin de la partie est perdu, ainsi que l’équipement porté… mais une tombe le garde
  const ids = g.lootOn ? Object.values(stats.equip || {}) : [];
  g.lost = inv.filter(it => ids.includes(it.id));
  const lostItems = [ // équipement porté + objets trouvés pendant cette partie
    ...g.lost.map(it => ({ kind: it.kind, data: it.data })),
    ...g.found.map(it => ({ kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }))
  ];
  if (g.lost.length) {
    inv = inv.filter(it => !ids.includes(it.id)); stats.equip = {};
    sb("/items?id=in.(" + ids.join(",") + ")", "DELETE").catch(() => {});
  }
  if (lostItems.length) { // la tombe apparaît au même endroit dans les parties des autres joueurs
    g.tomb = true;
    sb("/graves", "POST", { player_id: me, level: g.lvKey, name: meName, x: Math.round(g.p.x), y: Math.round(g.p.y), items: lostItems }, "return=minimal").catch(() => {});
  }
}
function showError(retry) {
  show("<h2>Connexion impossible</h2><p>Le jeu n’arrive pas à joindre la base de données. Vérifie ta connexion, puis réessaie.</p><button id='retry'>Réessayer</button>");
  document.getElementById("retry").onclick = retry;
}
async function showProfiles() {
  show("<h1>Veillée</h1><p>Chargement…</p>");
  try { players = await sb("/players?select=id,name,shards&order=id"); } catch (e) { return showError(showProfiles); }
  show("<h1>Veillée</h1><p>Qui joue ?</p>");
  const card = ov.firstChild;
  for (const pl of players) {
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span>" + pl.shards + " éclats de lune</span>"; b.firstChild.textContent = pl.name;
    b.onclick = async () => { try { await loadProfile(pl.id); showMenu(); } catch (e) { showError(showProfiles); } };
    card.appendChild(b);
  }
}

let g;
function newGame() {
  g = { state: "menu", t: 0, kills: 0, spawn: 0, cd: 0, ang: 0,
    p: { x: 0, y: 0, r: 12, hp: 100, max: 100, speed: 150, xp: 0, next: 5, lvl: 1, inv: 0, mag: 80 },
    w: { dmg: 10, rate: 0.6, count: 1, orbs: 0, orbDmg: 8, pierce: 0, mode: "proj", radius: 70 },
    enemies: [], shots: [], shards: [], loot: [], found: [], zones: [], fx: [], flames: [], ls: 0, boom: 0, flame: 0, regen: 0, dashOn: false, dashCd: 4, dashT: 0, dashCdT: 0, dashV: null, cls: "base", run: 0, runF: 0, ammo: 0, nodes: [], packs: [], ok: false, left: false, exitT: 0, lost: [], lv: LEVELS.foret, lvKey: "foret", unlockedNow: false, graves: [], gravePoll: 8, graveT: 0, graveId: 0, looting: false, tomb: false, msg: "", msgT: 0 };
}

// Un niveau = décor, quantité de ressources et de monstres, force des monstres (hp, dmg), part de monstres d’élite (elite).
const LEVELS = {
  foret: { n: "Forêt", bg: "#14211a", grid: "#1c2d23", nodes: 16, packs: 7, enemies: 110, bosses: [[650, 850], [950, 1200]], hp: 1, dmg: 1, elite: 0, nodeBonus: 0, loot: { mob: [[0, 1]], boss: [[4, 1]] }, drop: 0.012,
    d: "Des arbres épais cachent les monstres et les gisements. Peu de ressources, mais des monstres plus faibles. Vaincre un boss de la forêt ouvre la ville. Seuls des équipements communs y tombent, et les boss en lâchent des peu communs." },
  ville: { n: "Ville en ruines", lock: "lvl_ville", hint: "Vaincs un boss de la forêt pour débloquer ce niveau.", bg: "#1a1c26", grid: "#242738", nodes: 55, packs: 11, enemies: 230,
    bosses: [[600, 800], [850, 1000], [1050, 1220]], hp: 1.5, dmg: 1.4, elite: 0.12, nodeBonus: 1, loot: { mob: [[0, 70], [4, 30]], boss: [[4, 1]] }, drop: 0.014,
    d: "Des rues en ruines, beaucoup de ressources, mais des monstres bien plus nombreux et plus forts. Ils peuvent lâcher des équipements communs et peu communs." }
};
const HALF = 1300; // rayon de la carte ; la sortie est au centre, là où l’on commence
function spawnAt(x, y, aggro, boss) { // plus on s’éloigne de la sortie, plus les monstres sont nombreux et solides
  const L = g.lv, R = HALF - 20, rr = Math.hypot(x, y); if (rr > R) { x *= R / rr; y *= R / rr; }
  const d = Math.hypot(x, y), r = Math.random() - L.elite, sc = (1 + d / 900 + g.t / 240) * L.hp;
  if (boss) { const hp = 450 * sc, e = { x, y, r: 34, hp, max: hp, sp: 52, oc: 0, k: 3, boss: true, ph: 0, aggro: !!aggro }; g.enemies.push(e); return e; }
  const type = d > 900 ? (r < 0.3 ? 2 : r < 0.6 ? 1 : 0) : d > 550 ? (r < 0.12 ? 2 : r < 0.4 ? 1 : 0) : (r < 0.2 ? 1 : 0);
  const T = [{ r: 10, hp: 15, sp: 60, c: "#e05a5a" }, { r: 8, hp: 9, sp: 115, c: "#e8a838" }, { r: 18, hp: 70, sp: 42, c: "#a35ae0" }][type];
  const e = { x, y, r: T.r, hp: T.hp * sc, sp: T.sp * (0.9 + Math.random() * 0.2), c: T.c, oc: 0, k: type, ph: Math.random() * 6, aggro: !!aggro };
  g.enemies.push(e); return e;
}
function genWorld() { // remplit la carte selon le niveau : gisements, caisses de munitions, monstres et boss gardiens
  const L = g.lv, rnd = (a, b) => a + Math.random() * (b - a);
  const pos = (dmin, dmax) => { const a = rnd(0, 6.283), d = Math.sqrt(rnd(dmin * dmin, dmax * dmax)); return { x: Math.cos(a) * d, y: Math.sin(a) * d }; };
  for (let i = 0; i < L.nodes; i++) { const q = pos(180, 1250); g.nodes.push({ x: q.x, y: q.y, v: 1 + Math.floor(Math.hypot(q.x, q.y) / 350) + (Math.random() < 0.3 ? 1 : 0) + L.nodeBonus, prog: 0, ph: Math.random() * 6 }); }
  for (let i = 0; i < L.packs; i++) { const q = pos(150, 1250); g.packs.push({ x: q.x, y: q.y, v: 15 }); }
  for (let i = 0; i < L.enemies; i++) { const q = pos(300, 1250); spawnAt(q.x, q.y, false); }
  for (const [a, b] of L.bosses) { const q = pos(a, b); spawnAt(q.x, q.y, false, true); }
}

// ====== Mise à jour (appelée à chaque image) ======
async function refreshGraves() { // toutes les 8 s : nouvelles tombes, et tombes déjà libérées par d’autres joueurs
  const cur = g;
  try { const list = await sb("/graves?select=*&level=eq." + g.lvKey); if (g === cur && g.state !== "over") g.graves = list; } catch (e) {}
}
async function lootGrave(gr) { // la tombe disparaît pour tous ; son propriétaire récupère un ou plusieurs équipements perdus
  g.looting = true;
  const cur = g; let res = null;
  try { res = await sb("/rpc/loot_grave", "POST", { p_grave: gr.id }); }
  catch (e) { cur.msg = "Connexion perdue : réessaie."; cur.msgC = "#ff6a6a"; cur.msgT = 2.5; cur.looting = false; cur.graveT = 0; return; }
  cur.graves = cur.graves.filter(q => q.id !== gr.id); cur.graveT = 0; cur.looting = false;
  if (!res) { cur.msg = "Cette tombe a déjà été libérée."; cur.msgC = "#cfcfcf"; cur.msgT = 2.5; return; }
  const names = res.given.map(it => it.data.name).join(", ");
  if (res.owner === me) { // c’est ta propre tombe : l’équipement revient dans ton inventaire
    try { inv = await sb("/items?player_id=eq." + me + "&select=*&order=id"); } catch (e) {}
    cur.msg = "Tu récupères : " + names; cur.msgC = RAR_C[res.given[0].data.r || 0];
  } else { cur.msg = "Tombe de " + res.name + " libérée : il récupère " + res.given.length + " équipement" + (res.given.length > 1 ? "s" : "") + " !"; cur.msgC = "#d9c6ff"; }
  cur.msgT = 4;
}
function dealDamage(e, d) { // tous les dégâts du joueur passent ici (vol de vie du guerrier)
  e.aggro = true; const real = Math.min(d, Math.max(0, e.hp)); e.hp -= d;
  if (g.ls) g.p.hp = Math.min(g.p.max, g.p.hp + real * g.ls);
}
function explode(x, y, src) { // flèches explosives de l’archer
  const r = 40 + 15 * g.boom;
  for (const o of g.enemies) if (o !== src && Math.hypot(o.x - x, o.y - y) < r + o.r) dealDamage(o, g.w.dmg * 0.6);
  g.fx.push({ x, y, r, t: 0.25, c: "#ffb36b" });
}
function update(dt) {
  const p = g.p, w = g.w;
  g.t += dt; p.inv -= dt; g.ang += dt * 3;

  // Déplacement du joueur
  let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.q || keys.a || keys.arrowleft ? 1 : 0);
  let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.z || keys.w || keys.arrowup ? 1 : 0);
  if (stick) { mx += stick.x; my += stick.y; }
  const l = Math.hypot(mx, my);
  if (l > 1) { mx /= l; my /= l; }
  g.dashCdT -= dt;
  const wantDash = keys[" "] || keys.shift || dashReq; dashReq = false;
  if (g.dashOn && wantDash && g.dashCdT <= 0 && g.dashT <= 0) { // dash : direction choisie au départ
    const dl = Math.hypot(mx, my);
    g.dashV = dl > 0.1 ? { x: mx / dl, y: my / dl } : { x: p.face || 1, y: 0 };
    g.dashT = 0.18; g.dashCdT = g.dashCd;
  }
  if (g.dashT > 0) { // ruée rapide, invincible pendant toute sa durée
    g.dashT -= dt; p.inv = Math.max(p.inv, 0.02);
    p.x += g.dashV.x * p.speed * 4.2 * dt; p.y += g.dashV.y * p.speed * 4.2 * dt;
    g.fx.push({ x: p.x, y: p.y, r: 10, t: 0.2, c: "#d9c6ff" });
  } else { p.x += mx * p.speed * dt; p.y += my * p.speed * dt; }
  if (g.regen) p.hp = Math.min(p.max, p.hp + g.regen * dt);
  p.mov = !!(mx || my); if (mx) p.face = mx > 0 ? 1 : -1;
  const rr = Math.hypot(p.x, p.y); if (rr > HALF) { p.x *= HALF / rr; p.y *= HALF / rr; } // bord de la carte
  // Évacuation : reste 2 secondes dans la zone de sortie, une fois que tu t’en es éloigné
  if (rr > 300) g.left = true;
  if (rr < 55 && g.left) {
    g.exitT += dt;
    if (g.exitT >= 2) { g.ok = true; g.state = "over"; endRun(true); showOver(); return; }
  } else g.exitT = Math.max(0, g.exitT - dt * 2);

  // Renforts : après 2 min 30, des monstres te traquent (il est temps de repartir)
  g.spawn -= dt;
  if (g.t > 150 && g.spawn <= 0 && g.enemies.length < 260) {

    ctx.fillStyle = "rgba(120,200,255,.2)"; ctx.beginPath(); ctx.arc(n.x, n.y, 22, 0, 6.283); ctx.fill();
    for (const [dx, dy, k] of [[-8, 4, 0.7], [8, 5, 0.6], [0, 0, 1]]) {
      ctx.fillStyle = "#8fe3ff"; ctx.beginPath(); ctx.moveTo(n.x + dx, n.y + dy - 14 * k + b); ctx.lineTo(n.x + dx + 7 * k, n.y + dy + b);
      ctx.lineTo(n.x + dx, n.y + dy + 10 * k + b); ctx.lineTo(n.x + dx - 7 * k, n.y + dy + b); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("x" + n.v, n.x, n.y + 28);
    if (n.prog > 0) { ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(n.x, n.y, 26, -Math.PI / 2, -Math.PI / 2 + 6.283 * n.prog / 1.2); ctx.stroke(); }
  }
  for (const k of g.packs) { ctx.fillStyle = "#6b5a2a"; ctx.fillRect(k.x - 8, k.y - 6, 16, 12); ctx.fillStyle = "#ffe27a"; ctx.fillRect(k.x - 8, k.y - 6, 16, 3); ctx.fillRect(k.x - 2, k.y - 2, 4, 5); } // munitions
  for (const q of g.graves) { // tombes des joueurs morts : reste dessus pour libérer leur équipement
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(q.x, q.y + 6, 15, 5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#6b6585"; ctx.beginPath(); ctx.roundRect(q.x - 11, q.y - 22, 22, 28, [11, 11, 2, 2]); ctx.fill();
    ctx.fillStyle = "#3a3350"; ctx.fillRect(q.x - 1.5, q.y - 17, 3, 14); ctx.fillRect(q.x - 6, q.y - 12, 12, 3);
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("† " + q.name, q.x, q.y - 28);
    if (g.graveId === q.id && g.graveT > 0) { ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(q.x, q.y - 8, 28, -Math.PI / 2, -Math.PI / 2 + 6.283 * g.graveT / 3); ctx.stroke(); }
  }
  for (const s of g.shards) { // éclats de lune
    const b = Math.sin(g.t * 3 + s.ph) * 3;
    ctx.fillStyle = s.f ? "rgba(255,90,90,.28)" : "rgba(120,200,255,.25)"; ctx.beginPath(); ctx.arc(s.x, s.y + b, 16, 0, 6.283); ctx.fill();
    ctx.fillStyle = s.f ? "#ff6a6a" : "#8fe3ff"; ctx.beginPath(); ctx.moveTo(s.x, s.y - 10 + b); ctx.lineTo(s.x + 7, s.y + b); ctx.lineTo(s.x, s.y + 10 + b); ctx.lineTo(s.x - 7, s.y + b); ctx.closePath(); ctx.fill();
  }
  for (const l of g.loot) { // coffres d’équipement, de la couleur de leur rareté
    const c = RAR_C[l.it.r], b = Math.sin(g.t * 3 + l.ph) * 2;
    ctx.fillStyle = c + "44"; ctx.beginPath(); ctx.arc(l.x, l.y + b, 15, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#5a3d2b"; ctx.fillRect(l.x - 8, l.y - 5 + b, 16, 11);
    ctx.fillStyle = c; ctx.fillRect(l.x - 8, l.y - 5 + b, 16, 4); ctx.fillRect(l.x - 2, l.y - 2 + b, 4, 5);
  }
  for (const f of g.flames) { // flammes du mage
    const fl = (0.75 + 0.25 * Math.sin(g.t * 12 + f.x)) * Math.min(1, f.t);
    ctx.fillStyle = "rgba(255,120,40," + 0.22 * fl + ")"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,200,80," + 0.25 * fl + ")"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.55, 0, 6.283); ctx.fill();
  }
  for (const e of g.enemies) if (Math.abs(e.x - p.x) < W / 2 + 70 && Math.abs(e.y - p.y) < H / 2 + 70) sprite(e);
  for (const z of g.zones) { // zone magique : le disque se remplit avant l’explosion
    const k = 1 - z.t / 0.4;
    ctx.fillStyle = "rgba(184,138,240,.25)"; ctx.beginPath(); ctx.arc(z.x, z.y, z.r * k, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "rgba(184,138,240,.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.283); ctx.stroke();
  }
  for (const f of g.fx) { // coup d’épée et explosions
    const x = f.follow ? p.x : f.x, y = f.follow ? p.y : f.y, k = f.t / (f.follow ? 0.18 : 0.25);
    ctx.globalAlpha = Math.max(0, k); ctx.strokeStyle = f.c; ctx.lineWidth = 6 * k + 2;
    ctx.beginPath(); ctx.arc(x, y, f.r * (1.1 - 0.2 * k), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#ffe27a";
  for (const s of g.shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.283); ctx.fill(); }
  for (let i = 0; i < g.w.orbs; i++) {
    const a = g.ang + i * 6.283 / g.w.orbs;
    ctx.fillStyle = "#9fd8ff"; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 60, p.y + Math.sin(a) * 60, 9, 0, 6.283); ctx.fill();
  }
  drawTrees(cx, cy);
  ctx.globalAlpha = p.inv > 0 && Math.floor(g.t * 20) % 2 ? 0.4 : 1;
  drawHero(p);
  ctx.globalAlpha = 1; ctx.restore();

  // Interface : barre d’XP, PV, temps
  
  
  ctx.fillStyle = "#3a2f55"; ctx.fillRect(12, 18, 140, 12);
  ctx.fillStyle = "#e05a5a"; ctx.fillRect(12, 18, 140 * Math.max(0, p.hp) / p.max, 12);
  ctx.fillStyle = "#f0eaf7"; ctx.font = "14px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("Victimes : " + g.kills, 12, 48);
  ctx.fillStyle = "#8fe3ff"; ctx.fillText("Butin : " + g.run + " éclats" + (g.runF ? " · " + g.runF + " fragment" + (g.runF > 1 ? "s" : "") : "") + (g.found.length ? " · " + g.found.length + " équip." : ""), 12, 66); ctx.fillStyle = "#f0eaf7";
  ctx.fillStyle = g.ammo > 0 ? "#ffe27a" : "#ff6a6a"; ctx.fillText("Munitions : " + g.ammo + (g.ammo > 0 ? "" : " (coups de poing)"), 12, 84); ctx.fillStyle = "#f0eaf7";
  ctx.textAlign = "right"; ctx.fillText(fmt(g.t), W - 12, 30); ctx.fillText(g.lv.n, W - 12, 48);
  if (g.dashOn) { // bouton de dash (aussi : Espace ou Maj)
    const bx = W - 50, by = H - 50, ready = g.dashCdT <= 0, k = ready ? 1 : 1 - g.dashCdT / g.dashCd;
    ctx.fillStyle = "rgba(20,16,30,.55)"; ctx.beginPath(); ctx.arc(bx, by, 30, 0, 6.283); ctx.fill();
    ctx.strokeStyle = ready ? "#d9c6ff" : "#6b5a90"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by, 30, -Math.PI / 2, -Math.PI / 2 + 6.283 * k); ctx.stroke();
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("DASH", bx, by + 4);
  }
  if (g.msgT > 0) { ctx.textAlign = "center"; ctx.fillStyle = g.msgC || "#ff6a6a"; ctx.font = "bold 22px sans-serif"; ctx.fillText(g.msg, W / 2, 90); }
  const dEx = Math.hypot(p.x, p.y); // flèche vers la sortie, toujours visible autour du héros
  if (dEx > 70) {
    const a = Math.atan2(-p.y, -p.x), ax = W / 2 + Math.cos(a) * 58, ay = H / 2 + Math.sin(a) * 58;
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = "#ffd36b"; ctx.strokeStyle = "#14101c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-7, -10); ctx.lineTo(-3, 0); ctx.lineTo(-7, 10); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#ffd36b"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Sortie " + Math.round(dEx / 10) + " m", ax, ay + (Math.sin(a) > 0 ? 24 : -16));
  }
  if (g.exitT > 0) { ctx.textAlign = "center"; ctx.fillStyle = "#ffd36b"; ctx.font = "bold 18px sans-serif"; ctx.fillText("Évacuation… " + (2 - g.exitT).toFixed(1) + " s", W / 2, 120); }
  if (stick) {
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 50, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.ox + stick.x * 50, stick.oy + stick.y * 50, 18, 0, 6.283); ctx.stroke();
  }
}
const fmt = t => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(Math.floor(t % 60)).padStart(2, "0");

function applyClass(c) {
  const p = g.p, w = g.w;
  if (c === "guerrier") { p.max = Math.round(p.max * 1.5); w.mode = "slash"; w.dmg *= 2.2; w.rate = 0.9; w.radius = 75; }
  else if (c === "archer") { p.speed *= 1.2; w.count += 1; }
  else if (c === "mage") { p.max = Math.round(p.max * 0.9); w.mode = "zone"; w.rate = 1.1; w.radius = 55; w.dmg *= 1.2; }
}

// ====== État du camp : quels bâtiments sont débloqués ? ======
async function loadCity() { const r = await sb("/city?id=eq.1&select=*"); cityRow = r[0] || null; }
function cityState() { // les dons s’accumulent : chaque bâtiment consomme son coût dans l’ordre
  let f = cityRow ? cityRow.funded : 0, nb = 0;
  for (const B of BUILDINGS.slice(1)) { if (f >= B.cost) { f -= B.cost; nb++; } else break; }
  const total = BUILDINGS.slice(1).reduce((a, B) => a + B.cost, 0);
  return { nb, have: f, next: BUILDINGS[nb + 1] || null, left: Math.max(0, total - (cityRow ? cityRow.funded : 0)) };
}
const has = k => BUILDINGS.findIndex(b => b.k === k) <= cityState().nb;

// ====== Lancer une partie ======
function showLevels(cls) { // étape de choix du niveau, après le choix de la classe
  show("<h2>Choisis ton niveau</h2><p>Chaque niveau a ses dangers et ses richesses.</p>");
  const card = ov.firstChild;
  for (const [k, L] of Object.entries(LEVELS)) {
    const open = !L.lock || town[L.lock];
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span></span>"; b.disabled = !open;
    b.firstChild.textContent = L.n + (open ? "" : " (verrouillé)");
    b.lastChild.textContent = open ? L.d : L.hint;
    if (open) b.onclick = () => startGame(cls, k);
    card.appendChild(b);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = leaveTown;
  card.appendChild(back);
}
function play() { if (has("taverne")) showClasses(); else showLevels("base"); }
async function startGame(cls, lvl) { // lvl = clé du niveau (forêt par défaut)
  const lvKey = LEVELS[lvl] ? lvl : "foret";
  try { await loadCity(); } catch (e) {} // état du camp à jour
  let graves = []; try { graves = await sb("/graves?select=*&level=eq." + lvKey); } catch (e) {} // tombes des joueurs morts
  newGame(); g.state = "play"; ov.hidden = true; g.graves = graves; g.lvKey = lvKey; g.lv = LEVELS[lvKey];
  g.lootOn = has("armurerie"); g.cls = CLASSES[cls] ? cls : "base";
  g.p.max += 10 * (town.maison || 0); // maison
  if (CLASSES[cls]) {
    applyClass(cls);
    if (town.up_taverne) for (const T of TALENTS[cls]) T.f(g, ((stats.talents || {})[cls] || {})[T.id] || 0);
  }
  if (g.lootOn) { // bonus des équipements portés
    const eq = stats.equip || {};
    for (const it of inv) if (eq[it.kind] === it.id) {
      const v = it.data.val, t = it.data.st;
      if (t === "dmg") g.w.dmg *= 1 + v / 100;
      else if (t === "hp") g.p.max += v;
      else if (t === "speed") g.p.speed *= 1 + v / 100;
      else if (t === "mag") g.p.mag += v;
      if (it.data.fx && EFFECTS[it.data.fx]) EFFECTS[it.data.fx].f(g, it.data.fl || 1); // pouvoir spécial de l’objet
    }
  }
  g.p.hp = g.p.max;
  g.ammo = { guerrier: 45, archer: 70, mage: 50 }[g.cls] || 60; // munitions de départ selon la classe
  genWorld();
  g.msg = "Récolte des éclats, puis reviens à la sortie !"; g.msgC = "#ffd36b"; g.msgT = 5;
}

const SITE = '<rect x="-26" y="-22" width="52" height="24" fill="rgba(232,194,106,.12)" stroke="#e8c26a" stroke-width="2" stroke-dasharray="6 4"/><path d="M-26 2L-18 -26M26 2L18 -26" stroke="#8a6a3a" stroke-width="3"/><rect x="-20" y="-36" width="40" height="12" fill="#6b4f3a"/><text x="0" y="-27" text-anchor="middle" font-size="8" fill="#fff" font-family="sans-serif">chantier</text>';

function townSVG(nb, showSite) {
  const trees = [[22, 48], [378, 44], [352, 232], [34, 236], [150, 34], [262, 36], [12, 140], [390, 150]];
  const vis = BUILDINGS.map((B, i) => ({ B, i })).filter(o => o.i <= nb || (o.i === nb + 1 && showSite));
  let s = '<svg viewBox="0 0 400 256" width="100%" role="group" aria-label="Plan du camp" style="border-radius:8px;display:block;margin-bottom:10px"><rect width="400" height="256" fill="#22302a"/>';
  for (const { B } of vis) s += '<path d="M200 142L' + B.x + ' ' + (B.y - 6) + '" stroke="#4a4038" stroke-width="9" stroke-linecap="round" opacity=".85"/>';
  for (const [x, y] of trees) s += '<rect x="' + (x - 2) + '" y="' + (y + 18) + '" width="4" height="8" fill="#3a2a1c"/><path d="M' + x + ' ' + (y - 6) + 'l-12 26h24z" fill="#1b3a2a"/>';
  s += '<g transform="translate(200 142)"><circle cy="-4" r="26" fill="rgba(255,154,58,.12)"/><ellipse cy="4" rx="10" ry="4" fill="#2a1a10"/><path d="M0 -14q-8 10 0 18q8 -8 0 -18z" fill="#ff9a3a"/><path d="M0 -8q-4 6 0 10q4 -4 0 -10z" fill="#ffe27a"/></g>';
  for (const { B, i } of vis.sort((a, b) => a.B.y - b.B.y)) {
    const built = i <= nb, lv = B.k === "maison" ? town.maison || 0 : 0;
    s += '<g transform="translate(' + B.x + ' ' + B.y + ')"' + (built ? ' data-k="' + B.k + '" tabindex="0" role="button" aria-label="' + B.n + '" style="cursor:pointer"' : '') + '>' +
      '<ellipse cx="0" cy="3" rx="34" ry="6" fill="rgba(0,0,0,.28)"/>' +
      (built && townSel === B.k ? '<ellipse cx="0" cy="3" rx="40" ry="10" fill="none" stroke="#b88af0" stroke-width="2.5"/>' : '') +
      (built ? ART[B.k] + (() => { const t = B.n + (lv ? " (" + lv + ")" : ""), a = ' x="0" y="17" text-anchor="middle" font-size="11" font-family="Trebuchet MS,sans-serif"'; return '<text' + a + ' fill="none" stroke="#14101c" stroke-width="3.5" stroke-linejoin="round">' + t + '</text><text' + a + ' fill="#f0eaf7">' + t + '</text>'; })() : SITE) + '</g>';
  }
  return s + '</svg>';
}

let townData = { names: {} }, townSel = null;
const leaveTown = () => (g.state === "over" ? showOver() : showMenu());
const mecenes = names => {
  const t = Object.entries((cityRow && cityRow.contrib) || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, v]) => esc(names[id] || "?") + " (" + v + ")").join(", ");
  return t ? " Mécènes : " + t + "." : "";
};
async function showTown() { // charge l’état partagé du camp, puis dessine la carte
  show("<h2>La ville</h2><p>Chargement…</p>");
  try { await loadCity(); } catch (e) {}
  const names = {};
  try { for (const pl of await sb("/players?select=id,name")) names[pl.id] = pl.name; } catch (e) {}
  townData = { names }; renderTown();
}
function renderTown() {
  const names = townData.names, cs = cityState(), nb = cs.nb;
  if (!townSel) townSel = BUILDINGS[0].k;
  show("<h2>La ville</h2>" + townSVG(nb, !!cityRow && !!cs.next) + "<p>Éclats de lune : <b>" + bank + "</b> · Fragments de boss : <b>" + frag + "</b>. Touche un bâtiment pour voir sa fiche.</p>");
  const card = ov.firstChild; card.classList.add("wide");
  card.querySelectorAll("[data-k]").forEach(el => {
    const pick = () => { townSel = el.dataset.k; renderTown(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });
  const boxStyle = "border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px";

  const idx = BUILDINGS.findIndex(x => x.k === townSel);
  if (idx >= 0 && idx <= nb) { // fiche du bâtiment choisi
    const B = BUILDINGS[idx];
    const panel = document.createElement("div"); panel.style.cssText = boxStyle;
    panel.innerHTML = "<b>" + B.n + "</b><p style='margin:6px 0 10px'>" + B.d + "</p>";
    const add = (label, on, disabled, alt) => {
      const b = document.createElement("button");
      b.textContent = label; if (alt) b.className = "alt"; b.disabled = !!disabled; b.style.cssText = "margin:0 6px 6px 0"; b.onclick = on;
      panel.appendChild(b);
    };
    if (B.k === "maison") {
      const lv = town.maison || 0, full = lv >= 8, cost = Math.round(5 * 1.5 ** lv);
      add(full ? "Niveau maximum" : "Améliorer (niv. " + lv + "/8) – " + cost + " éclats", () => { bank -= cost; town.maison = lv + 1; saveRemote(true); renderTown(); }, full || bank < cost);
    }
    if (B.k === "armurerie") add("Ouvrir l’équipement", () => showEquip(showTown), false, true);
    if (B.k === "taverne" && town.up_taverne) add("Arbres de talents", () => showTalents(), false, true);
    if (B.up) {
      if (town[B.up.key]) panel.insertAdjacentHTML("beforeend", "<p style='margin:6px 0 0'>✓ Améliorée : " + B.up.d + "</p>");
      else {
        add("Améliorer – " + B.up.frag + " fragment" + (B.up.frag > 1 ? "s" : "") + " de boss", () => { frag -= B.up.frag; town[B.up.key] = 1; saveRemote(true); renderTown(); }, frag < B.up.frag);
        panel.insertAdjacentHTML("beforeend", "<p style='margin:6px 0 0;font-size:.9rem'>Amélioration : " + B.up.d + " Les fragments de boss sont lâchés par les boss.</p>");
      }
    }
    card.appendChild(panel);
  }

  const box = document.createElement("div"); box.style.cssText = boxStyle;
  if (!cityRow) { // table city absente ou injoignable
    box.innerHTML = "<b>Chantier commun indisponible</b><p style='margin:6px 0 0'>La base de données ne répond pas pour le camp.</p>";
    card.appendChild(box);
  } else if (cs.next) { // chantier commun : le prochain bâtiment
    const next = cs.next, need = next.cost - cs.have;
    box.innerHTML = "<b>Chantier commun : " + next.n + "</b><p style='margin:6px 0'>" + cs.have + " / " + next.cost + " éclats. Chacun peut donner autant qu’il veut." + mecenes(names) + "</p>" +
      "<div style='height:8px;background:var(--line);border-radius:4px;margin-bottom:10px'><div style='height:8px;width:" + Math.round(100 * cs.have / next.cost) + "%;background:var(--accent);border-radius:4px'></div></div>";
    for (const n of [...[5, 25].filter(v => v < need), need]) {
      const amount = Math.min(n, bank, cs.left);
      const b = document.createElement("button");
      b.className = "alt"; b.style.cssText = "margin:0 6px 6px 0";
      b.textContent = n === need ? "Compléter (" + Math.min(need, bank) + ")" : "Donner " + n;
      b.disabled = amount <= 0 || (n !== need && bank < n);
      b.onclick = async () => {
        try {
          await saveRemote(true); // envoie d’abord les éclats ramassés
          const res = await sb("/rpc/donate", "POST", { p_player: me, p_amount: amount });
          bank -= res.given;
        } catch (e) { return showError(showTown); }
        showTown();
      };
      box.appendChild(b);
    }
    card.appendChild(box);
  } else {
    box.innerHTML = "<b>Le camp est complet !</b><p style='margin:6px 0 0'>Merci à tous." + mecenes(names) + "</p>";
    card.appendChild(box);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = leaveTown;
  card.appendChild(back);
}

// ====== Choix de la classe avant une partie ======
function showClasses() {
  show("<h2>Choisis ta classe</h2><p>Ta classe change ta façon de combattre. Éclats de lune : <b>" + bank + "</b>.</p>");
  const card = ov.firstChild;
  for (const [k, C] of Object.entries(CLASSES)) {
    const open = C.cost === 0 || town["cl_" + k];
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span></span>";
    b.firstChild.textContent = C.n + (open ? "" : " (verrouillé)");
    b.lastChild.textContent = C.d + (open ? "" : " Débloquer : " + C.cost + " éclats.");
    if (open) {
      if ((stats.classe || "guerrier") === k) b.style.borderLeft = "6px solid var(--accent)";
      b.onclick = () => { stats.classe = k; saveRemote(true); showLevels(k); };
    } else {
      b.disabled = bank < C.cost;
      b.onclick = () => { bank -= C.cost; town["cl_" + k] = 1; saveRemote(true); showClasses(); };
    }
    card.appendChild(b);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = leaveTown;
  card.appendChild(back);
}

// ====== Arbres de talents (taverne améliorée) ======
let talentCls = "guerrier";
function showTalents() {
  const open = Object.keys(TALENTS).filter(k => CLASSES[k].cost === 0 || town["cl_" + k]);
  if (!open.includes(talentCls)) talentCls = open[0];
  show("<h2>Arbres de talents</h2><p>Éclats de lune : <b>" + bank + "</b>. Chaque classe a ses propres talents. Débloque d’autres classes en lançant une partie.</p>");
  const card = ov.firstChild;
  const tabs = document.createElement("div"); tabs.style.marginBottom = "10px";
  for (const k of open) {
    const t = document.createElement("button");
    t.className = k === talentCls ? "" : "alt"; t.style.cssText = "margin:0 6px 6px 0"; t.textContent = CLASSES[k].n;
    t.onclick = () => { talentCls = k; showTalents(); };
    tabs.appendChild(t);
  }
  card.appendChild(tabs);
  const mine = ((stats.talents = stats.talents || {})[talentCls] = stats.talents[talentCls] || {});
  for (const T of TALENTS[talentCls]) {
    const lv = mine[T.id] || 0, full = lv >= TALENT_COST.length, cost = TALENT_COST[lv];
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span></span>"; b.disabled = full || bank < cost;
    b.firstChild.textContent = T.n + " (niv. " + lv + "/" + TALENT_COST.length + ")";
    b.lastChild.textContent = T.d + " – " + (full ? "niveau max" : cost + " éclats");
    b.onclick = () => { bank -= cost; mine[T.id] = lv + 1; saveRemote(true); showTalents(); };
    card.appendChild(b);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = showTown;
  card.appendChild(back);
}

// ====== Équipement : choisir ce qu’on porte, et détruire ce dont on ne veut plus ======
let delPending = null;
async function destroyItem(it, from) {
  try { await sb("/items?id=eq." + it.id, "DELETE"); } catch (e) { return showError(() => showEquip(from)); }
  inv = inv.filter(x => x.id !== it.id);
  if (stats.equip && stats.equip[it.kind] === it.id) delete stats.equip[it.kind];
  bank += RECYCLE[it.data.r]; delPending = null; saveRemote(true); showEquip(from);
}
async function showEquip(from) { // from : écran où revenir (la ville) ; sinon menu ou fin de partie
  await lootP;
  const eq = stats.equip || (stats.equip = {});
  const worn = Object.keys(SLOTS).map(k => { const it = inv.find(x => x.id === eq[k]); return SLOTS[k].l + " : " + (it ? it.data.name : "vide"); }).join(" · ");
  show("<h2>Équipement</h2><p>Les bonus s’appliquent à la prochaine partie.</p><p style='font-size:.9rem'></p>");
  const card = ov.firstChild;
  card.querySelector("p:last-child").textContent = worn;
  if (!inv.length) card.insertAdjacentHTML("beforeend", "<p>Aucun équipement pour l’instant : ils tombent des ennemis et des boss.</p>");
  for (const it of inv.slice().sort((a, b) => RAR[b.data.r].ord - RAR[a.data.r].ord || a.kind.localeCompare(b.kind))) {
    const on = eq[it.kind] === it.id, R = RAR[it.data.r], S = SLOTS[it.kind];
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:6px;margin-bottom:8px";
    const b = document.createElement("button");
    b.className = "opt"; b.style.cssText = "margin:0;flex:1;width:auto;border-left:6px solid " + R.c;
    b.innerHTML = "<b></b><span></span>";
    b.firstChild.textContent = (on ? "✓ " : "") + it.data.name;
    b.lastChild.textContent = R.n + " · " + S.l + " · +" + it.data.val + S.u + (it.data.fx && EFFECTS[it.data.fx] ? " · ✦ " + EFFECTS[it.data.fx].n + " (" + EFFECTS[it.data.fx].d + ")" : "") + (on ? " (porté : cliquer pour retirer)" : "");
    b.onclick = () => { if (on) delete eq[it.kind]; else eq[it.kind] = it.id; saveRemote(true); showEquip(from); };
    row.appendChild(b);
    if (town.up_armurerie) { // recyclage débloqué par l’amélioration de l’armurerie
      const d = document.createElement("button");
      d.className = "alt"; d.textContent = delPending === it.id ? "Confirmer (+" + RECYCLE[it.data.r] + ")" : "Détruire (+" + RECYCLE[it.data.r] + ")";
      d.onclick = () => { if (delPending === it.id) destroyItem(it, from); else { delPending = it.id; showEquip(from); } };
      row.appendChild(d);
    }
    card.appendChild(row);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = typeof from === "function" ? from : leaveTown;
  card.appendChild(back);
}

// ====== OUTILS DE TEST (à supprimer avant d’ouvrir le jeu à tout le monde) ======
// Le bouton « Outils de test » n’apparaît que si l’adresse du jeu se termine par ?test
const TEST_MODE = /[?&]test\b/.test(location.search);
let resetPending = false;
function testAddFrag() { frag += 10; saveRemote(true); showTestTools(); }
async function testAddItem() { // équipement peu commun avec pouvoir spécial, pour tester
  let it = rollItem(true); while (!it.fx) it = rollItem(true);
  try { inv.push(...await sb("/items", "POST", [{ player_id: me, kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }], "return=representation")); } catch (e) {}
  showTestTools();
}
function testAddShards() { bank += 100; saveRemote(true); showTestTools(); }
async function testReset() { // efface la sauvegarde du joueur actif (pas le camp commun)
  if (!resetPending) { resetPending = true; return showTestTools(); }
  resetPending = false;
  try { await sb("/items?player_id=eq." + me, "DELETE"); } catch (e) { return showError(showTestTools); }
  bank = 0; frag = 0; inv = []; town = { maison: 0 }; stats = {};
  await saveRemote(true); showMenu();
}
function showTestTools() {
  show("<h2>Outils de test</h2><p>Joueur : <b></b><br>Éclats de lune : " + bank + " · Fragments de boss : " + frag + "</p>");
  const card = ov.firstChild;
  card.querySelector("b").textContent = meName;
  const add = (label, on, alt) => {
    const b = document.createElement("button");
    b.textContent = label; b.className = alt ? "alt" : ""; b.style.cssText = "margin:0 6px 8px 0"; b.onclick = on; card.appendChild(b);
  };
  add("+10 fragments de boss", testAddFrag);
  add("+100 éclats de lune", testAddShards);
  add("Débloquer la ville", () => { town.lvl_ville = 1; saveRemote(true); showTestTools(); });
  add("+1 équipement avec pouvoir", testAddItem);
  add(resetPending ? "Confirmer : tout effacer" : "Effacer toute ma sauvegarde", testReset, true);
  add("Retour", () => { resetPending = false; showMenu(); }, true);
}

// ====== Boucle principale ======
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (g.state === "play") update(dt);
  draw();
  requestAnimationFrame(loop);
}
newGame();
(async function start() {
  show("<h1>Veillée</h1><p>Chargement…</p>");
  let last0 = NaN; try { last0 = parseInt(localStorage.getItem("veillee_dernier")); } catch (e) {}
  if (last0 >= 0) { try { await loadProfile(last0); showMenu(); return; } catch (e) {} }
  showProfiles();
})();
requestAnimationFrame(loop);
</script>
