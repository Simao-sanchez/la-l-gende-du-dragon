<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veillée – prototype survivor</title>
<style>
:root{
  --bg:#ece7f2; --ink:#1f1a2b; --card:#ffffff; --muted:#6b6280; --accent:#7a3cc9; --line:#d6cde3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#120e1b;--ink:#f0eaf7;--card:#1e1830;--muted:#a79bc0;--accent:#b88af0;--line:#3a2f55}
}
:root[data-theme="dark"]{--bg:#120e1b;--ink:#f0eaf7;--card:#1e1830;--muted:#a79bc0;--accent:#b88af0;--line:#3a2f55}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#game{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.6);padding:16px;box-sizing:border-box}
#ov[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;width:100%;box-sizing:border-box}
.card h1,.card h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:1.7rem}
.card p{margin:0 0 14px;color:var(--muted);line-height:1.5}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 18px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.card{max-height:100%;overflow:auto}
button:disabled{opacity:.5;cursor:default}
.card.wide{max-width:600px}
[data-k]:focus-visible{outline:2px solid var(--accent)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.opt:hover{border-color:var(--accent)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas><div id="ov"></div></div>
<script>
// ====== Mise en place du canvas ======
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), ov = document.getElementById("ov");
let W = 0, H = 0;
function resize(){ const r = cv.parentElement.getBoundingClientRect(); W = cv.width = r.width; H = cv.height = r.height; }
addEventListener("resize", resize); resize();

// ====== Contrôles : clavier (ZQSD / WASD / flèches) et glisser du doigt ======
const keys = {};
addEventListener("keydown", e => { const k = e.key.toLowerCase(); keys[k] = true; if (k.startsWith("arrow")) e.preventDefault(); });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
let stick = null, dashReq = false, drag = null; // drag = sort en cours de visée (on le glisse de son icône vers la cible)
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (g && g.state === "play") {
    const i = spellAt(sx, sy);
    if (i >= 0) { // les icônes de sorts sont sur les côtés : on les fait glisser vers la cible
      if (g.spellCd[i] <= 0 && !drag) { drag = { id: e.pointerId, i, sx, sy }; cv.setPointerCapture(e.pointerId); }
      return;
    }
    if (g.dashOn && Math.hypot(sx - (W - 50), sy - (H - 50)) < 42) { dashReq = true; return; } // bouton de dash
  }
  stick = { id: e.pointerId, ox: sx, oy: sy, x: 0, y: 0, l: r.left, t: r.top }; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (drag && e.pointerId === drag.id) { const r = cv.getBoundingClientRect(); drag.sx = e.clientX - r.left; drag.sy = e.clientY - r.top; return; }
  if (!stick || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.l - stick.ox, dy = e.clientY - stick.t - stick.oy;
  const d = Math.hypot(dx, dy), m = 50;
  if (d > m) { dx = dx / d * m; dy = dy / d * m; }
  stick.x = dx / m; stick.y = dy / m;
});
["pointerup", "pointercancel"].forEach(n => cv.addEventListener(n, e => {
  if (drag && e.pointerId === drag.id) { const d = drag; drag = null; if (n === "pointerup") castSpell(d); return; }
  if (stick && e.pointerId === stick.id) stick = null;
}));

// ====== Sorts : 4 sorts sur les côtés de l’écran, à faire glisser vers la zone ou le monstre visé ======
const SPELLS = [ // seul le montant des dégâts change (et le temps de recharge, pour que le choix ait un sens)
  { n: "Étincelle", c: "#9fd8ff", dmg: 12, r: 55, cd: 2 },
  { n: "Éclair", c: "#ffe27a", dmg: 26, r: 55, cd: 4 },
  { n: "Boule de feu", c: "#ff8a4a", dmg: 55, r: 55, cd: 8 },
  { n: "Météore", c: "#d08bff", dmg: 120, r: 55, cd: 15 }
];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };
const spellPos = i => ({ x: i < 2 ? 44 : W - 44, y: H * 0.38 + (i % 2) * 78 }); // 2 sorts à gauche, 2 à droite
const spellAt = (x, y) => { for (let i = 0; i < 4; i++) { const s = spellPos(i); if (Math.hypot(x - s.x, y - s.y) < 34) return i; } return -1; };
function aimTarget(sx, sy) { // point visé dans le monde ; s’il y a un monstre tout près, le sort le vise lui (et le suit)
  const x = sx + g.p.x - W / 2, y = sy + g.p.y - H / 2;
  let best = null, bd = 34;
  for (const e of g.enemies) { const d = Math.hypot(e.x - x, e.y - y) - e.r; if (d < bd) { bd = d; best = e; } }
  return best ? { x: best.x, y: best.y, e: best } : { x, y, e: null };
}
function castSpell(d) { // relâché : le sort tombe là où on l’a visé ; relâché sur son icône, il est annulé
  if (!g || g.state !== "play" || g.spellCd[d.i] > 0) return;
  const ic = spellPos(d.i);
  if (Math.hypot(d.sx - ic.x, d.sy - ic.y) < 44) return;
  const t = aimTarget(d.sx, d.sy), S = SPELLS[d.i];
  g.spellCd[d.i] = S.cd;
  g.zones.push({ x: t.x, y: t.y, t: 0.3, T: 0.3, r: S.r, d: S.dmg * g.spellMul, c: S.c, follow: t.e, spell: true });
}

// ====== Équipements : raretés, emplacements, tirage ======
const RAR = [ // la position dans la liste est l’identifiant stocké dans la base : ne pas réordonner
  // ord = ordre d’affichage, m = puissance des bonus, fxp = chance d’avoir un pouvoir spécial
  { n: "Commun", c: "#b8b8c8", m: 1, ord: 0, fxp: 0.15 },
  { n: "Rare", c: "#5ab0ff", m: 1.6, ord: 2, fxp: 1 },
  { n: "Épique", c: "#b66bff", m: 2.5, ord: 3, fxp: 1 },
  { n: "Légendaire", c: "#ffb13b", m: 4, ord: 4, fxp: 1 },
  { n: "Peu commun", c: "#6fd36f", m: 1.3, ord: 1, fxp: 0.6 }
];
const RAR_C = RAR.map(r => r.c);
// Pouvoirs spéciaux que certains équipements donnent en plus de leurs bonus (l = niveau du pouvoir, selon la rareté)
const EFFECTS = {
  ls: { n: "Vol de vie", d: "soigne 4 % des dégâts infligés", f: (g, l) => { g.ls += 0.04 * l; } },
  boom: { n: "Flèches explosives", d: "les projectiles explosent en zone à l’impact", f: (g, l) => { g.boom += l; } },
  flame: { n: "Terre brûlée", d: "les zones magiques laissent des flammes", f: (g, l) => { g.flame += l; } },
  pierce: { n: "Traversée", d: "les tirs percent un ennemi de plus", f: (g, l) => { g.w.pierce += l; } },
  multi: { n: "Tir multiple", d: "un projectile ou une zone de plus", f: g => { g.w.count++; } },
  reach: { n: "Grande allonge", d: "+25 % de portée du coup d’épée et des zones", f: g => { g.w.radius *= 1.25; } },
  regen: { n: "Régénération", d: "récupère 1 PV par seconde", f: (g, l) => { g.regen += l; } },
  dash: { n: "Dash", d: "Espace, Maj ou bouton DASH : ruée invincible, recharge 4 s", f: (g, l) => { g.dashOn = true; g.dashCd *= Math.pow(0.8, l - 1); } },
  orb: { n: "Orbe gardienne", d: "une orbe tourne autour de toi et blesse les ennemis", f: (g, l) => { g.w.orbs += l; } }
};
const SLOTS = { // fx = pouvoirs possibles pour cet emplacement
  arme: { l: "Arme", base: 8, u: " % de dégâts", names: ["Dague", "Épée", "Faux", "Arbalète"], st: "dmg", fx: ["ls", "boom", "flame", "pierce", "multi", "reach"] },
  armure: { l: "Armure", base: 8, u: " PV", names: ["Gilet", "Cotte de mailles", "Cuirasse"], st: "hp", fx: ["regen"] },
  bottes: { l: "Bottes", base: 4, u: " % de vitesse", names: ["Sandales", "Bottes", "Jambières"], st: "speed", fx: ["dash"] },
  amulette: { l: "Amulette", base: 25, u: " px de portée de ramassage", names: ["Médaillon", "Talisman", "Croc"], st: "mag", fx: ["orb"] }
};
const EPITHET = ["de fortune", "d’argent", "de la nuit", "du roi vampire", "de chasseur"];
function makeItem(r, forceFx) { // équipement de rareté r (position dans RAR) ; forceFx = pouvoir spécial obligatoire
  const slot = Object.keys(SLOTS)[Math.floor(Math.random() * 4)], S = SLOTS[slot], R = RAR[r];
  const val = Math.round(S.base * R.m * (0.9 + Math.random() * 0.2));
  const it = { kind: slot, r, st: S.st, val, name: S.names[Math.floor(Math.random() * S.names.length)] + " " + EPITHET[r] };
  if (forceFx || Math.random() < R.fxp) { it.fx = S.fx[Math.floor(Math.random() * S.fx.length)]; it.fl = Math.max(1, R.ord); } // pouvoir spécial
  return it;
}
function rollItem(boss) { // la rareté dépend du niveau (LEVELS.loot) : monstres d’un côté, boss de l’autre
  const table = boss ? g.lv.loot.boss : g.lv.loot.mob;
  let x = Math.random() * table.reduce((a, [, w]) => a + w, 0), r = table[0][0];
  for (const [id, w] of table) { r = id; if (x < w) break; x -= w; }
  return makeItem(r);
}
let lootP = Promise.resolve();
function saveLoot() { // enregistre dans la base les objets trouvés pendant la partie
  if (!g.found.length) return;
  const rows = g.found.map(it => ({ player_id: me, kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }));
  lootP = sb("/items", "POST", rows, "return=representation").then(r => { inv.push(...r); }).catch(() => {});
}


// ====== État du jeu ======
// ====== Connexion à Supabase (base de données en ligne) ======
const SB_URL = "https://dzfuhtcblzaygssydtbv.supabase.co/rest/v1";
const SB_KEY = "sb_publishable_vSFxEvXCbP55trZHchKeoQ_SDma64LB"; // clé publique, faite pour être visible
async function sb(path, method, body, prefer) {
  const h = { apikey: SB_KEY, "Content-Type": "application/json" };
  if (prefer || method === "PATCH") h.Prefer = prefer || "return=minimal";
  const r = await fetch(SB_URL + path, { method: method || "GET", keepalive: !!method && method !== "GET", headers: h, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return method === "PATCH" || method === "DELETE" || prefer === "return=minimal" ? null : r.json();
}
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// Données du joueur actif (chargées depuis la base)
let me = -1, meName = "", bank = 0, stats = {}, players = [], inv = [], frag = 0, cityRow = null; // inv = équipements, frag = fragments de boss, cityRow = état du camp
let town = { forge: 0, auberge: 0, ecuries: 0, biblio: 0 };
let saveTimer = null;
function saveRemote(now) { // enregistre éclats, ville et statistiques
  clearTimeout(saveTimer);
  const go = () => { stats.frag = frag; return sb("/players?id=eq." + me, "PATCH", { shards: bank, town, stats, updated_at: new Date().toISOString() }).catch(() => {}); };
  if (now) return go();
  saveTimer = setTimeout(go, 1500);
}
const saveBank = () => saveRemote(false);
const saveTown = () => saveRemote(true);
addEventListener("pagehide", () => { if (me >= 0) saveRemote(true); });

async function loadProfile(i) {
  const rows = await sb("/players?id=eq." + i + "&select=*");
  if (!rows[0]) throw new Error("profil introuvable");
  me = i; meName = rows[0].name; bank = rows[0].shards; stats = rows[0].stats || {};
  frag = stats.frag || 0;
  town = Object.assign({ maison: 0 }, rows[0].town);
  if (!town.maison && town.auberge) town.maison = town.auberge; // l’ancien niveau « auberge » devient celui de la maison
  inv = await sb("/items?player_id=eq." + i + "&select=*&order=id");
  try { await loadCity(); } catch (e) {}
  try { localStorage.setItem("veillee_dernier", i); } catch (e) {} // le navigateur retient le dernier joueur
}
function endRun(ok) { // ok = évacuation réussie ; sinon le joueur est mort
  stats.parties = (stats.parties || 0) + 1;
  stats.victimes = (stats.victimes || 0) + g.kills;
  stats.meilleurTemps = Math.max(stats.meilleurTemps || 0, Math.floor(g.t));
  
  if (ok) { // le butin n’est gardé que si on sort vivant
    stats.evacuations = (stats.evacuations || 0) + 1;
    bank += g.run; frag += g.runF; saveLoot();
  } else loseGear();
  saveRemote(true);
}
function loseGear() { // mort : le butin de la partie est perdu, ainsi que l’équipement porté… mais une tombe le garde
  const ids = g.lootOn ? Object.values(stats.equip || {}) : [];
  g.lost = inv.filter(it => ids.includes(it.id));
  const lostItems = [ // équipement porté + objets trouvés pendant cette partie
    ...g.lost.map(it => ({ kind: it.kind, data: it.data })),
    ...g.found.map(it => ({ kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }))
  ];
  if (g.lost.length) {
    inv = inv.filter(it => !ids.includes(it.id)); stats.equip = {};
    sb("/items?id=in.(" + ids.join(",") + ")", "DELETE").catch(() => {});
  }
  if (lostItems.length) { // la tombe apparaît au même endroit dans les parties des autres joueurs
    g.tomb = true;
    sb("/graves", "POST", { player_id: me, level: g.lvKey, name: meName, x: Math.round(g.p.x), y: Math.round(g.p.y), items: lostItems }, "return=minimal").catch(() => {});
  }
}
function showError(retry) {
  show("<h2>Connexion impossible</h2><p>Le jeu n’arrive pas à joindre la base de données. Vérifie ta connexion, puis réessaie.</p><button id='retry'>Réessayer</button>");
  document.getElementById("retry").onclick = retry;
}
async function showProfiles() {
  show("<h1>Veillée</h1><p>Chargement…</p>");
  try { players = await sb("/players?select=id,name,shards&order=id"); } catch (e) { return showError(showProfiles); }
  show("<h1>Veillée</h1><p>Qui joue ?</p>");
  const card = ov.firstChild;
  for (const pl of players) {
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span>" + pl.shards + " éclats de lune</span>"; b.firstChild.textContent = pl.name;
    b.onclick = async () => { try { await loadProfile(pl.id); showMenu(); } catch (e) { showError(showProfiles); } };
    card.appendChild(b);
  }
}

let g;
function newGame() {
  g = { state: "menu", t: 0, kills: 0, spawn: 0, cd: 0, ang: 0,
    p: { x: 0, y: 0, r: 12, hp: 60, max: 60, speed: 135, xp: 0, next: 5, lvl: 1, inv: 0, mag: 80 },
    w: { dmg: 7, rate: 0.6, count: 1, orbs: 0, orbDmg: 8, pierce: 0, mode: "proj", radius: 70 },
    enemies: [], shots: [], shards: [], loot: [], found: [], zones: [], fx: [], flames: [], eshots: [], rings: [], pks: [], spellCd: [0, 0, 0, 0], spellMul: 1, ls: 0, boom: 0, flame: 0, regen: 0, dashOn: false, dashCd: 4, dashT: 0, dashCdT: 0, dashV: null, cls: "base", run: 0, runF: 0, ammo: 0, nodes: [], packs: [], ok: false, left: false, exitT: 0, lost: [], lv: LEVELS.lisiere, lvKey: "lisiere", unlockedNow: false, graves: [], gravePoll: 8, graveT: 0, graveId: 0, looting: false, tomb: false, msg: "", msgT: 0 };
}

// Un niveau = décor, quantité de ressources et de monstres, force des monstres (hp, dmg), part de monstres d’élite (elite).
const LEVELS = {
  // Lisière : zone d’entraînement du début (petite carte, monstres faibles et peu nombreux, peu de ressources)
  lisiere: { n: "Lisière", radius: 650, trees: 0.28, basic: true, bg: "#17261c", grid: "#21352a", nodes: 8, packs: 3, enemies: 24, bosses: [], hp: 0.65, dmg: 0.6, elite: 0, nodeBonus: 0,
    loot: { mob: [[0, 1]], boss: [[0, 1]] }, drop: 0.01,
    d: "Zone d’entraînement : peu de monstres, tous faibles, et peu de ressources. Rapporte quelques éclats, améliore ton personnage en ville, puis aventure-toi plus loin." },
  // power = Puissance minimale pour y entrer (somme des niveaux d’entraînement de la ville)
  foret: { n: "Forêt", radius: 1300, trees: 0.6, power: 8, bg: "#14211a", grid: "#1c2d23", nodes: 16, packs: 7, enemies: 60, meutes: 22, bosses: [[650, 850], [950, 1200, "garruk"]], hp: 1, dmg: 1, elite: 0, nodeBonus: 0, charge: true, loot: { mob: [[0, 1]], boss: [[4, 1]] }, drop: 0.012,
    d: "Des arbres épais cachent les monstres et les gisements. Peu de ressources, mais des monstres plus faibles : des meutes de 3 loups rôdent entre les arbres, et Garruk règne sur la forêt. Vaincre un boss de la forêt ouvre la ville. Seuls des équipements communs y tombent, et les boss en lâchent des peu communs." },
  ville: { n: "Ville en ruines", radius: 1300, lock: "lvl_ville", hint: "Vaincs un boss de la forêt pour débloquer ce niveau.", bg: "#1a1c26", grid: "#242738", nodes: 55, packs: 11, enemies: 230,
    bosses: [[600, 800], [850, 1000], [1050, 1220, "karn"]], tireurs: 0.2, hp: 1.5, dmg: 1.4, elite: 0.12, nodeBonus: 1, loot: { mob: [[0, 70], [4, 30]], boss: [[4, 1]] }, drop: 0.014,
    d: "Des rues en ruines, beaucoup de ressources, mais des monstres bien plus nombreux et plus forts, dont des tireurs fragiles qui gardent leurs distances. Karn règne sur la ville. Les monstres peuvent lâcher des équipements communs et peu communs." }
};
// Le rayon de la carte (LEVELS.radius) varie selon le niveau ; la sortie est au centre, là où l’on commence.
// ====== Obstacles : murs des ruines (ville) et troncs d’arbres (forêt) ======
// Ces calculs doivent rester identiques à ceux du dessin (decor et drawTrees) : même grille, mêmes dimensions.
function ruinRects(i, j) { // murs de la ruine de l’îlot (i, j), en rectangles [x, y, largeur, hauteur] ; la porte est un trou dans le mur du bas
  if (Math.abs(Math.sin(i * 91.7 + j * 173.1) * 12345.6) % 1 > 0.8) return [];
  const x0 = i * 360 + 56, y0 = j * 360 + 56, bw = 248, t = 3.5; // 56 = demi-rue + 24 ; 248 = 360 - 64 - 48
  return [[x0, y0 - t, bw, 2 * t], [x0 - t, y0, 2 * t, bw], [x0 + bw - t, y0, 2 * t, bw], [x0, y0 + bw - t, bw * 0.32, 2 * t], [x0 + bw * 0.68, y0 + bw - t, bw * 0.32, 2 * t]];
}
function treeCell(i, j) { // arbre de la cellule (i, j) de la forêt, ou null
  const cs = 80, h = Math.abs(Math.sin(i * 53.7 + j * 211.3) * 31415.9) % 1;
  if (h > (g.lv.trees || 0.6)) return null;
  const x = i * cs + ((h * 9973) % 1) * cs, y = j * cs + ((h * 7919) % 1) * cs, d = Math.hypot(x, y);
  if (d < 120 || d > g.lv.radius + 40) return null; // la sortie reste dégagée
  return { x, y, r: 26 + ((h * 4409) % 1) * 14 }; // r = rayon de la cime ; le tronc est un petit cercle sous la cime
}
function blocked(x, y, r) { // le cercle (x, y, r) touche-t-il un obstacle ?
  if (g.lvKey === "ville") {
    const st = 360;
    for (let i = Math.floor((x - r - 8) / st); i <= Math.floor((x + r + 8) / st); i++)
      for (let j = Math.floor((y - r - 8) / st); j <= Math.floor((y + r + 8) / st); j++)
        for (const [rx, ry, rw, rh] of ruinRects(i, j)) {
          const cx = Math.max(rx, Math.min(x, rx + rw)), cy = Math.max(ry, Math.min(y, ry + rh));
          if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
        }
  } else if (g.lvKey === "foret" || g.lvKey === "lisiere") {
    const cs = 80;
    for (let i = Math.floor((x - r - 10) / cs); i <= Math.floor((x + r + 10) / cs); i++)
      for (let j = Math.floor((y - r - 20) / cs); j <= Math.floor((y + r + 20) / cs); j++) {
        const t = treeCell(i, j);
        if (t && (x - t.x) ** 2 + (y - (t.y + 9)) ** 2 < (r + 7) ** 2) return true;
      }
  }
  return false;
}
function lineClear(x1, y1, x2, y2) { // aucun obstacle entre les deux points ? (sert à ne pas tirer à travers un mur)
  const n = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 10);
  for (let k = 1; k < n; k++) { const t = k / n; if (blocked(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 2)) return false; }
  return true;
}
function moveBy(o, dx, dy, r) { // déplace o en glissant le long des obstacles (s’il est déjà coincé dedans, il peut en sortir)
  if (blocked(o.x, o.y, r)) { o.x += dx; o.y += dy; return; }
  if (!blocked(o.x + dx, o.y, r)) o.x += dx;
  if (!blocked(o.x, o.y + dy, r)) o.y += dy;
}
const BOSSES = { // boss nommés : Garruk règne sur la forêt, Karn sur la ville
  garruk: { name: "Garruk", r: 38, hpMul: 1, sp: 54, skin: "garruk", howl: true }, // charge, hurlement qui appelle des meutes, rage sous 40 % de vie
  karn: { name: "Karn", r: 36, hpMul: 0.8, sp: 44, skin: "karn", armor: 0.35 } // blindé, salves en éventail, onde de choc
};
function spawnPack(x, y, aggro) { // meute de 3 loups (forêt) : faibles et rapides, ils patrouillent et s’alertent ensemble
  const R = g.lv.radius - 40, rr = Math.hypot(x, y); if (rr > R) { x *= R / rr; y *= R / rr; }
  for (let k = 0; k < 10 && blocked(x, y, 30); k++) { x += (Math.random() - 0.5) * 80; y += (Math.random() - 0.5) * 80; }
  const sc = (1 + Math.hypot(x, y) / 900 + g.t / 240) * g.lv.hp;
  const pk = { home: { x, y }, tx: x, ty: y, wanderT: Math.random() * 3, alert: !!aggro, members: [] };
  for (const [ox, oy] of [[-20, -8], [20, -8], [0, 16]]) {
    const e = { x: x + ox, y: y + oy, r: 8, hp: 8 * sc, sp: 95 * (0.95 + Math.random() * 0.1), c: "#6f7480", oc: 0, k: 4, ph: Math.random() * 6, aggro: !!aggro, pack: pk, off: [ox, oy], dmg: 0.6 };
    pk.members.push(e); g.enemies.push(e);
  }
  g.pks.push(pk);
}
function fireAt(x, y, ang, speed, dmg, c) { g.eshots.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 4, dmg, c }); } // projectile ennemi
function shooterAI(e, dx, dy, d, dt) { // tireur (ville) : fragile, garde ses distances et tire des projectiles lents (le dash les traverse)
  const R = e.r * 0.8, sp = e.sp;
  if (d < 170) moveBy(e, -dx / d * sp * 1.3 * dt, -dy / d * sp * 1.3 * dt, R); // recule si on s’approche
  else if (d > 320) moveBy(e, dx / d * sp * dt, dy / d * sp * dt, R);
  else { const s = e.ph > 3 ? 1 : -1; moveBy(e, -dy / d * s * sp * 0.6 * dt, dx / d * s * sp * 0.6 * dt, R); } // tourne autour du joueur
  e.volT -= dt;
  if (e.volT <= 0 && d < 430 && lineClear(e.x, e.y, g.p.x, g.p.y)) { e.volT = 2.2 + Math.random() * 0.8; fireAt(e.x, e.y, Math.atan2(dy, dx), 190, 7); }
}
function bossKarn(e, dx, dy, d, dt) { // Karn : blindé (−35 % de dégâts), salves en éventail, onde de choc au sol
  const R = e.r * 0.8;
  if (e.st === "slam") { e.stT -= dt; if (e.stT <= 0) e.st = "chase"; return; } // figé pendant la préparation de l’onde de choc
  e.volT -= dt; e.slamT -= dt;
  if (d > 200) moveBy(e, dx / d * e.sp * dt, dy / d * e.sp * dt, R);
  else if (d < 130) moveBy(e, -dx / d * e.sp * 0.7 * dt, -dy / d * e.sp * 0.7 * dt, R);
  if (e.slamT <= 0 && d < 400) { e.slamT = 9; e.st = "slam"; e.stT = 0.9; g.rings.push({ x: e.x, y: e.y, r: 135, T: 0.9, t: 0.9, dmg: 26 }); g.msg = "Karn frappe le sol !"; g.msgC = "#ff8a5a"; g.msgT = 2; }
  else if (e.volT <= 0 && d < 540 && lineClear(e.x, e.y, g.p.x, g.p.y)) { e.volT = 3; const a = Math.atan2(dy, dx); for (let i = -2; i <= 2; i++) fireAt(e.x, e.y, a + i * 0.2, 210, 9, "#ffb36b"); }
}
function bossCharge(e, dx, dy, d, dt) { // cycle : poursuite, hurlement (Garruk), visée (1 s, couloir rouge), charge en ligne droite, repos
  const R = e.r * 0.8, rage = e.howl && e.hp < e.max * 0.4, sp = e.sp * (rage ? 1.3 : 1);
  e.stT -= dt; if (e.howl) e.howlT -= dt;
  if (e.st === "chase") {
    moveBy(e, dx / d * sp * dt, dy / d * sp * dt, R);
    if (e.howl && e.howlT <= 0 && g.enemies.length < 280) { e.st = "howl"; e.stT = 0.9; g.msg = e.name + " hurle !"; g.msgC = "#9be37a"; g.msgT = 2; }
    else if (e.stT <= 0) { if (d > 140 && d < 560) { e.st = "wind"; e.stT = 1; } else e.stT = 1.5; }
  } else if (e.st === "howl") { // appel de la meute : cercles verts, puis 3 loups (6 en rage)
    if (Math.floor(e.stT * 6) !== Math.floor((e.stT + dt) * 6)) g.fx.push({ x: e.x, y: e.y, r: 60 + (0.9 - e.stT) * 110, t: 0.25, c: "#9be37a" });
    if (e.stT <= 0) { spawnPack(e.x + 70, e.y + 40, true); if (rage) spawnPack(e.x - 70, e.y - 40, true); e.howlT = rage ? 7 : 11; e.st = "chase"; e.stT = 2; }
  } else if (e.st === "wind") {
    if (e.stT > 0.35) { e.cx = dx / d; e.cy = dy / d; } // il suit le joueur, puis la direction est verrouillée : c’est le moment d’esquiver
    if (e.stT <= 0) { e.st = "charge"; e.stT = 0.6; }
  } else if (e.st === "charge") {
    const step = 420 * (rage ? 1.15 : 1) * dt, x0 = e.x, y0 = e.y;
    moveBy(e, e.cx * step, e.cy * step, R);
    if (Math.hypot(e.x - x0, e.y - y0) < step * 0.5 || e.stT <= 0) { e.st = "rest"; e.stT = 0.8; } // un obstacle l’arrête : il est étourdi
  } else if (e.stT <= 0) { e.st = "chase"; e.stT = (rage ? 2 : 4) + Math.random() * (rage ? 2 : 4); }
}
function spawnAt(x, y, aggro, boss) { // plus on s’éloigne de la sortie, plus les monstres sont nombreux et solides
  const L = g.lv, R = L.radius - 20, rr = Math.hypot(x, y); if (rr > R) { x *= R / rr; y *= R / rr; }
  for (let k = 0; k < 10 && blocked(x, y, 16); k++) { x += (Math.random() - 0.5) * 80; y += (Math.random() - 0.5) * 80; } // pas dans un mur
  const d = Math.hypot(x, y), r = Math.random() - L.elite, sc = (1 + d / 900 + g.t / 240) * L.hp;
  if (boss) { // boss ordinaire, ou boss nommé (BOSSES) avec ses pouvoirs
    const B = BOSSES[boss] || {}, hp = 450 * sc * (B.hpMul || 1);
    const e = { x, y, r: B.r || 34, hp, max: hp, sp: B.sp || 52, oc: 0, k: 3, boss: true, ph: 0, aggro: !!aggro, st: "chase", stT: 4 + Math.random() * 4, cx: 0, cy: 0,
      name: B.name, skin: B.skin, howl: !!B.howl, howlT: 8, armor: B.armor || 0, volT: 2, slamT: 6 };
    g.enemies.push(e); return e;
  }
  if (Math.random() < (L.tireurs || 0)) { // tireur (ville) : fragile, tire de loin
    const e = { x, y, r: 9, hp: 9 * sc, sp: 42, c: "#ff6ac8", oc: 0, k: 5, ph: Math.random() * 6, aggro: !!aggro, volT: 0.5 + Math.random() * 1.5 };
    g.enemies.push(e); return e;
  }
  const type = L.basic ? 0 : d > 900 ? (r < 0.3 ? 2 : r < 0.6 ? 1 : 0) : d > 550 ? (r < 0.12 ? 2 : r < 0.4 ? 1 : 0) : (r < 0.2 ? 1 : 0);
  const T = [{ r: 10, hp: 15, sp: 60, c: "#e05a5a" }, { r: 8, hp: 9, sp: 115, c: "#e8a838" }, { r: 18, hp: 70, sp: 42, c: "#a35ae0" }][type];
  const e = { x, y, r: T.r, hp: T.hp * sc, sp: T.sp * (0.9 + Math.random() * 0.2), c: T.c, oc: 0, k: type, ph: Math.random() * 6, aggro: !!aggro };
  g.enemies.push(e); return e;
}
function genWorld() { // remplit la carte selon le niveau : gisements, caisses de munitions, monstres et boss gardiens
  const L = g.lv, R = L.radius - 50, near = Math.min(300, R * 0.4), rnd = (a, b) => a + Math.random() * (b - a);
  const pos = (dmin, dmax, r = 18) => { for (let k = 0; ; k++) { const a = rnd(0, 6.283), d = Math.sqrt(rnd(dmin * dmin, dmax * dmax)), q = { x: Math.cos(a) * d, y: Math.sin(a) * d }; if (k > 15 || !blocked(q.x, q.y, r)) return q; } }; // jamais dans un obstacle
  for (let i = 0; i < L.nodes; i++) { const q = pos(180, R); g.nodes.push({ x: q.x, y: q.y, v: 1 + Math.floor(Math.hypot(q.x, q.y) / 350) + (Math.random() < 0.3 ? 1 : 0) + L.nodeBonus, prog: 0, ph: Math.random() * 6 }); }
  for (let i = 0; i < L.packs; i++) { const q = pos(150, R); g.packs.push({ x: q.x, y: q.y, v: 15 }); }
  for (let i = 0; i < L.enemies; i++) { const q = pos(near, R); spawnAt(q.x, q.y, false); }
  for (let i = 0; i < (L.meutes || 0); i++) { const q = pos(near, R, 30); spawnPack(q.x, q.y, false); } // meutes de loups (forêt)
  for (const [a, b, who] of L.bosses) { const q = pos(a, b, 30); spawnAt(q.x, q.y, false, who || true); }
}

// ====== Mise à jour (appelée à chaque image) ======
async function refreshGraves() { // toutes les 8 s : nouvelles tombes, et tombes déjà libérées par d’autres joueurs
  const cur = g;
  try { const list = await sb("/graves?select=*&level=eq." + g.lvKey); if (g === cur && g.state !== "over") g.graves = list; } catch (e) {}
}
async function lootGrave(gr) { // la tombe disparaît pour tous ; son propriétaire récupère un ou plusieurs équipements perdus
  g.looting = true;
  const cur = g; let res = null;
  try { res = await sb("/rpc/loot_grave", "POST", { p_grave: gr.id }); }
  catch (e) { cur.msg = "Connexion perdue : réessaie."; cur.msgC = "#ff6a6a"; cur.msgT = 2.5; cur.looting = false; cur.graveT = 0; return; }
  cur.graves = cur.graves.filter(q => q.id !== gr.id); cur.graveT = 0; cur.looting = false;
  if (!res) { cur.msg = "Cette tombe a déjà été libérée."; cur.msgC = "#cfcfcf"; cur.msgT = 2.5; return; }
  const names = res.given.map(it => it.data.name).join(", ");
  if (res.owner === me) { // c’est ta propre tombe : l’équipement revient dans ton inventaire
    try { inv = await sb("/items?player_id=eq." + me + "&select=*&order=id"); } catch (e) {}
    cur.msg = "Tu récupères : " + names; cur.msgC = RAR_C[res.given[0].data.r || 0];
  } else { cur.msg = "Tombe de " + res.name + " libérée : il récupère " + res.given.length + " équipement" + (res.given.length > 1 ? "s" : "") + " !"; cur.msgC = "#d9c6ff"; }
  cur.msgT = 4;
}
function dealDamage(e, d) { // tous les dégâts du joueur passent ici (vol de vie du guerrier)
  e.aggro = true; e.hurt = true; if (e.armor) d *= 1 - e.armor; const real = Math.min(d, Math.max(0, e.hp)); e.hp -= d;
  if (g.ls) g.p.hp = Math.min(g.p.max, g.p.hp + real * g.ls);
}
function explode(x, y, src) { // flèches explosives de l’archer
  const r = 40 + 15 * g.boom;
  for (const o of g.enemies) if (o !== src && Math.hypot(o.x - x, o.y - y) < r + o.r) dealDamage(o, g.w.dmg * 0.6);
  g.fx.push({ x, y, r, t: 0.25, c: "#ffb36b" });
}
function update(dt) {
  const p = g.p, w = g.w;
  g.t += dt; p.inv -= dt; g.ang += dt * 3;

  // Déplacement du joueur
  let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.q || keys.a || keys.arrowleft ? 1 : 0);
  let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.z || keys.w || keys.arrowup ? 1 : 0);
  if (stick) { mx += stick.x; my += stick.y; }
  const l = Math.hypot(mx, my);
  if (l > 1) { mx /= l; my /= l; }
  g.dashCdT -= dt;
  for (let i = 0; i < 4; i++) g.spellCd[i] = Math.max(0, g.spellCd[i] - dt); // recharge des sorts
  const wantDash = keys[" "] || keys.shift || dashReq; dashReq = false;
  if (g.dashOn && wantDash && g.dashCdT <= 0 && g.dashT <= 0) { // dash : direction choisie au départ
    const dl = Math.hypot(mx, my);
    g.dashV = dl > 0.1 ? { x: mx / dl, y: my / dl } : { x: p.face || 1, y: 0 };
    g.dashT = 0.18; g.dashCdT = g.dashCd;
  }
  if (g.dashT > 0) { // ruée rapide, invincible pendant toute sa durée
    g.dashT -= dt; p.inv = Math.max(p.inv, 0.02);
    moveBy(p, g.dashV.x * p.speed * 4.2 * dt, g.dashV.y * p.speed * 4.2 * dt, 10);
    g.fx.push({ x: p.x, y: p.y, r: 10, t: 0.2, c: "#d9c6ff" });
  } else moveBy(p, mx * p.speed * dt, my * p.speed * dt, 10);
  if (g.regen) p.hp = Math.min(p.max, p.hp + g.regen * dt);
  p.mov = !!(mx || my); if (mx) p.face = mx > 0 ? 1 : -1;
  const rr = Math.hypot(p.x, p.y); if (rr > g.lv.radius) { p.x *= g.lv.radius / rr; p.y *= g.lv.radius / rr; } // bord de la carte
  // Évacuation : reste 2 secondes dans la zone de sortie, une fois que tu t’en es éloigné
  if (rr > 300) g.left = true;
  if (rr < 55 && g.left) {
    g.exitT += dt;
    if (g.exitT >= 2) { g.ok = true; g.state = "over"; endRun(true); showOver(); return; }
  } else g.exitT = Math.max(0, g.exitT - dt * 2);

  // Renforts : après 2 min 30, des monstres te traquent (il est temps de repartir)
  g.spawn -= dt;
  if (g.t > 150 && g.spawn <= 0 && g.enemies.length < 260) {
    g.spawn = Math.max(1.5, 9 - (g.t - 150) / 40);
    const a = Math.random() * 6.283, d = Math.max(W, H) / 2 + 40;
    if (g.lv.meutes && Math.random() < 0.5) spawnPack(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, true); // renforts : parfois une meute
    else spawnAt(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, true);
  }
  g.msgT -= dt;
  for (const s of g.shards) if (Math.hypot(s.x - p.x, s.y - p.y) < p.r + 14 + (p.mag - 80)) { s.got = true; if (s.f) { g.runF++; g.msg = "Fragment de boss !"; g.msgC = "#ff7a7a"; g.msgT = 2; } else g.run++; }
  g.shards = g.shards.filter(s => !s.got && Math.hypot(s.x - p.x, s.y - p.y) < 1000);
  for (const l of g.loot) if (Math.hypot(l.x - p.x, l.y - p.y) < p.r + 16 + (p.mag - 80)) {
    l.got = true; g.found.push(l.it); g.msg = "Trouvé : " + l.it.name + (l.it.fx ? " ✦ " + EFFECTS[l.it.fx].n : ""); g.msgC = RAR_C[l.it.r]; g.msgT = 2.5;
  }
  g.loot = g.loot.filter(l => !l.got && Math.hypot(l.x - p.x, l.y - p.y) < 1400);
  for (const n of g.nodes) { // récolte : reste près d’un gisement pour le vider
    if (Math.hypot(n.x - p.x, n.y - p.y) < 36) {
      n.prog += dt;
      if (n.prog >= 1.2) { n.got = true; g.run += n.v; g.msg = "+" + n.v + " éclat" + (n.v > 1 ? "s" : ""); g.msgC = "#8fe3ff"; g.msgT = 1.5; }
    } else n.prog = Math.max(0, n.prog - dt * 0.5);
  }
  g.nodes = g.nodes.filter(n => !n.got);
  for (const k of g.packs) if (Math.hypot(k.x - p.x, k.y - p.y) < p.r + 16 + (p.mag - 80)) { // caisses de munitions
    k.got = true; g.ammo = Math.min(120, g.ammo + k.v); g.msg = "+" + k.v + " munitions"; g.msgC = "#ffe27a"; g.msgT = 1.5;
  }
  g.packs = g.packs.filter(k => !k.got);
  g.gravePoll -= dt; // tombes : mise à jour régulière, puis pillage en restant dessus 3 secondes
  if (g.gravePoll <= 0) { g.gravePoll = 8; refreshGraves(); }
  const gr = g.graves.find(q => Math.hypot(q.x - p.x, q.y - p.y) < 34);
  if (gr && !g.looting) {
    if (g.graveId !== gr.id) { g.graveId = gr.id; g.graveT = 0; }
    g.graveT += dt;
    if (g.graveT >= 3) lootGrave(gr);
  } else if (!gr) g.graveT = Math.max(0, g.graveT - dt * 2);

  // Attaque automatique : tir (aventurier, archer), coup d’épée (guerrier) ou zone magique (mage). Chaque attaque coûte 1 munition.
  g.cd -= dt;
  if (g.cd <= 0) {
    const d2 = e => (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
    const near = g.enemies.filter(e => d2(e) < 420 * 420).sort((a, b) => d2(a) - d2(b));
    const mode = g.ammo > 0 ? w.mode : "fist"; // sans munitions : de simples coups de poing
    if (mode === "fist") {
      if (near.length && Math.sqrt(d2(near[0])) < 34 + near[0].r) {
        dealDamage(near[0], w.dmg * 0.35); g.fx.push({ follow: true, r: 30, t: 0.12, c: "#cfcfcf" }); g.cd = 0.9;
      }
    } else if (mode === "slash") {
      if (near.length && Math.sqrt(d2(near[0])) < w.radius + near[0].r + 10) {
        for (const e of g.enemies) if (Math.sqrt(d2(e)) < w.radius + e.r) dealDamage(e, w.dmg);
        g.fx.push({ follow: true, r: w.radius, t: 0.18, c: "#ffe9b0" });
        g.cd = w.rate; g.ammo--;
      }
    } else if (mode === "zone") {
      if (near.length) {
        for (let i = 0; i < w.count && i < near.length; i++) g.zones.push({ x: near[i].x, y: near[i].y, t: 0.4, r: w.radius, d: w.dmg * 1.6 });
        g.cd = w.rate; g.ammo--;
      }
    } else {
      const vis = near.filter(e => lineClear(p.x, p.y, e.x, e.y)); // on ne tire pas à travers un mur
      if (vis.length) {
        const base = Math.atan2(vis[0].y - p.y, vis[0].x - p.x);
        for (let i = 0; i < w.count; i++) {
          const a = base + (i - (w.count - 1) / 2) * 0.18;
          g.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, life: 1.2, pl: w.pierce, hit: [] });
        }
        g.cd = w.rate; g.ammo--;
      }
    }
  }
  for (const z of g.zones) { // les zones magiques explosent après un court délai
    z.t -= dt;
    if (z.follow && z.follow.hp > 0 && z.t > 0) { z.x = z.follow.x; z.y = z.follow.y; } // un sort lancé sur un monstre le suit
    if (z.t <= 0) {
      z.done = true;
      for (const e of g.enemies) if (Math.hypot(e.x - z.x, e.y - z.y) < z.r + e.r) dealDamage(e, z.d);
      g.fx.push({ x: z.x, y: z.y, r: z.r, t: 0.25, c: z.c || "#b88af0" });
      if (g.flame && !z.spell) g.flames.push({ x: z.x, y: z.y, r: z.r * 0.85, t: 2 + g.flame, k: 0 }); // flammes laissées sur place
    }
  }
  g.zones = g.zones.filter(z => !z.done);
  for (const f of g.flames) { // les flammes brûlent les ennemis qui restent dedans
    f.t -= dt; f.k -= dt;
    if (f.k <= 0) { f.k = 0.5; for (const e of g.enemies) if (Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r) dealDamage(e, g.w.dmg * 0.3 * g.flame); }
  }
  g.flames = g.flames.filter(f => f.t > 0);
  for (const f of g.fx) f.t -= dt;
  g.fx = g.fx.filter(f => f.t > 0);

  // Projectiles
  for (const s of g.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (blocked(s.x, s.y, 2)) { s.life = 0; continue; } // le tir s’arrête contre un mur ou un tronc
    for (const e of g.enemies) {
      if (s.pl < 0) break;
      if (s.hit.includes(e)) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 4) { dealDamage(e, w.dmg); s.hit.push(e); s.pl--; if (g.boom) explode(e.x, e.y, e); }
    }
  }
  g.shots = g.shots.filter(s => s.life > 0 && s.pl >= 0);

  // Orbes qui tournent autour du joueur

      ctx.fillStyle = "#1d5432"; ctx.beginPath(); ctx.arc(x - r * 0.25, y - 10 - r * 0.25, r * 0.7, 0, 6.283); ctx.fill();
    }
  ctx.globalAlpha = 1;
}

// ====== Dessin ======
function draw() {
  const p = g.p, cx = p.x - W / 2, cy = p.y - H / 2;
  ctx.fillStyle = g.lv.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = g.lv.grid; ctx.lineWidth = 1; ctx.beginPath();
  const gs = 64, ox = -(((cx % gs) + gs) % gs), oy = -(((cy % gs) + gs) % gs);
  for (let x = ox; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.save(); ctx.translate(-cx, -cy);
  decor(cx, cy);
  ctx.fillStyle = "rgba(8,6,12,.78)"; ctx.beginPath(); ctx.rect(-5000, -5000, 10000, 10000); ctx.arc(0, 0, g.lv.radius, 0, 6.283, true); ctx.fill(); // hors de la carte
  ctx.strokeStyle = "#8a3a4a"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, g.lv.radius, 0, 6.283); ctx.stroke();
  { // zone de sortie
    const pulse = 0.5 + 0.5 * Math.sin(g.t * 3);
    ctx.fillStyle = "rgba(255,211,107," + (0.10 + 0.08 * pulse) + ")"; ctx.beginPath(); ctx.arc(0, 0, 55, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#ffd36b"; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(0, 0, 55, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#ffd36b"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.fillText("SORTIE", 0, 4);
    if (g.exitT > 0) { ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 64, -Math.PI / 2, -Math.PI / 2 + 6.283 * g.exitT / 2); ctx.stroke(); }
  }
  for (const n of g.nodes) { // gisements d’éclats : plus loin de la sortie = plus riches
    const b = Math.sin(g.t * 2 + n.ph) * 2;
    ctx.fillStyle = "rgba(120,200,255,.2)"; ctx.beginPath(); ctx.arc(n.x, n.y, 22, 0, 6.283); ctx.fill();
    for (const [dx, dy, k] of [[-8, 4, 0.7], [8, 5, 0.6], [0, 0, 1]]) {
      ctx.fillStyle = "#8fe3ff"; ctx.beginPath(); ctx.moveTo(n.x + dx, n.y + dy - 14 * k + b); ctx.lineTo(n.x + dx + 7 * k, n.y + dy + b);
      ctx.lineTo(n.x + dx, n.y + dy + 10 * k + b); ctx.lineTo(n.x + dx - 7 * k, n.y + dy + b); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("x" + n.v, n.x, n.y + 28);
    if (n.prog > 0) { ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(n.x, n.y, 26, -Math.PI / 2, -Math.PI / 2 + 6.283 * n.prog / 1.2); ctx.stroke(); }
  }
  for (const k of g.packs) { ctx.fillStyle = "#6b5a2a"; ctx.fillRect(k.x - 8, k.y - 6, 16, 12); ctx.fillStyle = "#ffe27a"; ctx.fillRect(k.x - 8, k.y - 6, 16, 3); ctx.fillRect(k.x - 2, k.y - 2, 4, 5); } // munitions
  for (const q of g.graves) { // tombes des joueurs morts : reste dessus pour libérer leur équipement
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(q.x, q.y + 6, 15, 5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#6b6585"; ctx.beginPath(); ctx.roundRect(q.x - 11, q.y - 22, 22, 28, [11, 11, 2, 2]); ctx.fill();
    ctx.fillStyle = "#3a3350"; ctx.fillRect(q.x - 1.5, q.y - 17, 3, 14); ctx.fillRect(q.x - 6, q.y - 12, 12, 3);
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("† " + q.name, q.x, q.y - 28);
    if (g.graveId === q.id && g.graveT > 0) { ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(q.x, q.y - 8, 28, -Math.PI / 2, -Math.PI / 2 + 6.283 * g.graveT / 3); ctx.stroke(); }
  }
  for (const s of g.shards) { // éclats de lune
    const b = Math.sin(g.t * 3 + s.ph) * 3;
    ctx.fillStyle = s.f ? "rgba(255,90,90,.28)" : "rgba(120,200,255,.25)"; ctx.beginPath(); ctx.arc(s.x, s.y + b, 16, 0, 6.283); ctx.fill();
    ctx.fillStyle = s.f ? "#ff6a6a" : "#8fe3ff"; ctx.beginPath(); ctx.moveTo(s.x, s.y - 10 + b); ctx.lineTo(s.x + 7, s.y + b); ctx.lineTo(s.x, s.y + 10 + b); ctx.lineTo(s.x - 7, s.y + b); ctx.closePath(); ctx.fill();
  }
  for (const l of g.loot) { // coffres d’équipement, de la couleur de leur rareté
    const c = RAR_C[l.it.r], b = Math.sin(g.t * 3 + l.ph) * 2;
    ctx.fillStyle = c + "44"; ctx.beginPath(); ctx.arc(l.x, l.y + b, 15, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#5a3d2b"; ctx.fillRect(l.x - 8, l.y - 5 + b, 16, 11);
    ctx.fillStyle = c; ctx.fillRect(l.x - 8, l.y - 5 + b, 16, 4); ctx.fillRect(l.x - 2, l.y - 2 + b, 4, 5);
  }
  for (const f of g.flames) { // flammes du mage
    const fl = (0.75 + 0.25 * Math.sin(g.t * 12 + f.x)) * Math.min(1, f.t);
    ctx.fillStyle = "rgba(255,120,40," + 0.22 * fl + ")"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(255,200,80," + 0.25 * fl + ")"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.55, 0, 6.283); ctx.fill();
  }
  for (const e of g.enemies) if (Math.abs(e.x - p.x) < W / 2 + 70 && Math.abs(e.y - p.y) < H / 2 + 70) sprite(e);
  for (const z of g.zones) { // zone magique : le disque se remplit avant l’explosion
    const k = 1 - z.t / (z.T || 0.4), c = z.c || "#b88af0";
    ctx.fillStyle = rgba(c, 0.25); ctx.beginPath(); ctx.arc(z.x, z.y, z.r * k, 0, 6.283); ctx.fill();
    ctx.strokeStyle = rgba(c, 0.9); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.283); ctx.stroke();
  }
  for (const f of g.fx) { // coup d’épée et explosions
    const x = f.follow ? p.x : f.x, y = f.follow ? p.y : f.y, k = f.t / (f.follow ? 0.18 : 0.25);
    ctx.globalAlpha = Math.max(0, k); ctx.strokeStyle = f.c; ctx.lineWidth = 6 * k + 2;
    ctx.beginPath(); ctx.arc(x, y, f.r * (1.1 - 0.2 * k), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#ffe27a";
  for (const s of g.shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.283); ctx.fill(); }
  for (const q of g.eshots) { // projectiles ennemis
    ctx.fillStyle = "rgba(255,106,200,.3)"; ctx.beginPath(); ctx.arc(q.x, q.y, 9, 0, 6.283); ctx.fill();
    ctx.fillStyle = q.c || "#ff6ac8"; ctx.beginPath(); ctx.arc(q.x, q.y, 4.5, 0, 6.283); ctx.fill();
  }
  for (const rg of g.rings) { // onde de choc de Karn : le disque se remplit avant l’explosion
    const k = 1 - rg.t / rg.T;
    ctx.fillStyle = "rgba(255,90,60," + (0.12 + 0.2 * k) + ")"; ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r * k, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "rgba(255,120,80,.9)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.283); ctx.stroke();
  }
  for (let i = 0; i < g.w.orbs; i++) {
    const a = g.ang + i * 6.283 / g.w.orbs;
    ctx.fillStyle = "#9fd8ff"; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 60, p.y + Math.sin(a) * 60, 9, 0, 6.283); ctx.fill();
  }
  drawTrees(cx, cy);
  for (const e of g.enemies) if (e.st === "wind" || e.st === "charge") { // le couloir rouge montre où le boss va charger
    const locked = e.st === "charge" || e.stT < 0.35;
    ctx.lineCap = "butt"; ctx.strokeStyle = "rgba(255,60,60," + (locked ? 0.28 : 0.14) + ")"; ctx.lineWidth = 56;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.cx * 280, e.y + e.cy * 280); ctx.stroke();
    ctx.strokeStyle = "rgba(255,90,90," + (locked ? 0.9 : 0.5) + ")"; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = p.inv > 0 && Math.floor(g.t * 20) % 2 ? 0.4 : 1;
  drawHero(p);
  ctx.globalAlpha = 1; ctx.restore();

  // Interface : barre d’XP, PV, temps
  
  
  ctx.fillStyle = "#3a2f55"; ctx.fillRect(12, 18, 140, 12);
  ctx.fillStyle = "#e05a5a"; ctx.fillRect(12, 18, 140 * Math.max(0, p.hp) / p.max, 12);
  ctx.fillStyle = "#f0eaf7"; ctx.font = "14px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("Victimes : " + g.kills, 12, 48);
  ctx.fillStyle = "#8fe3ff"; ctx.fillText("Butin : " + g.run + " éclats" + (g.runF ? " · " + g.runF + " fragment" + (g.runF > 1 ? "s" : "") : "") + (g.found.length ? " · " + g.found.length + " équip." : ""), 12, 66); ctx.fillStyle = "#f0eaf7";
  ctx.fillStyle = g.ammo > 0 ? "#ffe27a" : "#ff6a6a"; ctx.fillText("Munitions : " + g.ammo + (g.ammo > 0 ? "" : " (coups de poing)"), 12, 84); ctx.fillStyle = "#f0eaf7";
  ctx.textAlign = "right"; ctx.fillText(fmt(g.t), W - 12, 30); ctx.fillText(g.lv.n, W - 12, 48);
  drawSpells(cx, cy);
  if (g.dashOn) { // bouton de dash (aussi : Espace ou Maj)
    const bx = W - 50, by = H - 50, ready = g.dashCdT <= 0, k = ready ? 1 : 1 - g.dashCdT / g.dashCd;
    ctx.fillStyle = "rgba(20,16,30,.55)"; ctx.beginPath(); ctx.arc(bx, by, 30, 0, 6.283); ctx.fill();
    ctx.strokeStyle = ready ? "#d9c6ff" : "#6b5a90"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by, 30, -Math.PI / 2, -Math.PI / 2 + 6.283 * k); ctx.stroke();
    ctx.fillStyle = "#f0eaf7"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("DASH", bx, by + 4);
  }
  if (g.msgT > 0) { ctx.textAlign = "center"; ctx.fillStyle = g.msgC || "#ff6a6a"; ctx.font = "bold 22px sans-serif"; ctx.fillText(g.msg, W / 2, 90); }
  const dEx = Math.hypot(p.x, p.y); // flèche vers la sortie, toujours visible autour du héros
  if (dEx > 70) {
    const a = Math.atan2(-p.y, -p.x), ax = W / 2 + Math.cos(a) * 58, ay = H / 2 + Math.sin(a) * 58;
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = "#ffd36b"; ctx.strokeStyle = "#14101c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-7, -10); ctx.lineTo(-3, 0); ctx.lineTo(-7, 10); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#ffd36b"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Sortie " + Math.round(dEx / 10) + " m", ax, ay + (Math.sin(a) > 0 ? 24 : -16));
  }
  if (g.exitT > 0) { ctx.textAlign = "center"; ctx.fillStyle = "#ffd36b"; ctx.font = "bold 18px sans-serif"; ctx.fillText("Évacuation… " + (2 - g.exitT).toFixed(1) + " s", W / 2, 120); }
  if (stick) {
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 50, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.ox + stick.x * 50, stick.oy + stick.y * 50, 18, 0, 6.283); ctx.stroke();
  }
}
const fmt = t => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(Math.floor(t % 60)).padStart(2, "0");

// ====== Écrans (menu, niveau, fin) ======

function showMenu() {

    "<p>Clavier : Z Q S D, W A S D ou flèches. Écran tactile : glisse ton doigt.</p><p>Éclats de lune en réserve : <b>" + bank + "</b>.</p><button id='go'>Jouer</button> <button id='town' class='alt'>La ville</button>" + (has("armurerie") ? " <button id='eq' class='alt'>Équipement</button>" : "") + " <button id='who' class='alt'>Changer de joueur</button>");

// ====== Classes, talents et recyclage ======
const CLASSES = {
  guerrier: { n: "Guerrier", cost: 0, d: "+50 % de PV. Coup d’épée circulaire plus puissant, mais à courte portée." },
  archer: { n: "Archer", cost: 50, d: "+20 % de vitesse et un second projectile dès le départ." },
  mage: { n: "Mage", cost: 500, d: "Des zones magiques tombent sur les ennemis (+20 % de dégâts), mais −10 % de PV." }
};
const TALENT_COST = [10, 25, 50]; // éclats de lune pour les niveaux 1, 2 et 3 d’un talent
const TALENTS = {
  guerrier: [
    { id: "peau", n: "Peau de pierre", d: "+10 PV par niveau", f: (g, l) => { g.p.max += 10 * l; } },
    { id: "lame", n: "Lame lourde", d: "+8 % de dégâts par niveau", f: (g, l) => { g.w.dmg *= 1 + 0.08 * l; } },
    { id: "allonge", n: "Bras long", d: "+8 % de portée par niveau", f: (g, l) => { g.w.radius *= 1 + 0.08 * l; } }
  ],
  archer: [
    { id: "pieds", n: "Pieds ailés", d: "+5 % de vitesse par niveau", f: (g, l) => { g.p.speed *= 1 + 0.05 * l; } },
    { id: "carquois", n: "Carquois renforcé", d: "+8 % de dégâts par niveau", f: (g, l) => { g.w.dmg *= 1 + 0.08 * l; } },
    { id: "oeil", n: "Œil de lynx", d: "−5 % de délai entre les tirs par niveau", f: (g, l) => { g.w.rate *= 1 - 0.05 * l; } }
  ],
  mage: [
    { id: "erudit", n: "Concentration", d: "−5 % de délai entre les sorts par niveau", f: (g, l) => { g.w.rate *= 1 - 0.05 * l; } },
    { id: "astres", n: "Pluie d’astres", d: "+8 % de dégâts par niveau", f: (g, l) => { g.w.dmg *= 1 + 0.08 * l; } },
    { id: "ampleur", n: "Zone élargie", d: "+8 % de rayon par niveau", f: (g, l) => { g.w.radius *= 1 + 0.08 * l; } }
  ]
};
const RECYCLE = [1, 3, 8, 20, 2]; // éclats rendus pour un équipement détruit, dans l’ordre de RAR : commun, rare, épique, légendaire, peu commun

function applyClass(c) {
  const p = g.p, w = g.w;
  if (c === "guerrier") { p.max = Math.round(p.max * 1.5); w.mode = "slash"; w.dmg *= 2.2; w.rate = 0.9; w.radius = 75; }
  else if (c === "archer") { p.speed *= 1.2; w.count += 1; }
  else if (c === "mage") { p.max = Math.round(p.max * 0.9); w.mode = "zone"; w.rate = 1.1; w.radius = 55; w.dmg *= 1.2; }
}

// ====== État du camp : quels bâtiments sont débloqués ? ======
async function loadCity() { const r = await sb("/city?id=eq.1&select=*"); cityRow = r[0] || null; }
function cityState() { // les dons s’accumulent : chaque bâtiment consomme son coût dans l’ordre
  let f = cityRow ? cityRow.funded : 0, nb = 0;
  for (const B of BUILDINGS.slice(1)) { if (f >= B.cost) { f -= B.cost; nb++; } else break; }
  const total = BUILDINGS.slice(1).reduce((a, B) => a + B.cost, 0);
  return { nb, have: f, next: BUILDINGS[nb + 1] || null, left: Math.max(0, total - (cityRow ? cityRow.funded : 0)) };
}
const has = k => BUILDINGS.findIndex(b => b.k === k) <= cityState().nb;
const puissance = () => (town.maison || 0) + (town.entrainement || 0) + (town.arsenal || 0); // somme des niveaux d’entraînement : mesure la force du personnage
const levelOpen = L => (!L.lock || town[L.lock]) && puissance() >= (L.power || 0);
const trackCost = (T, lv) => Math.round(T.c0 * 1.45 ** lv); // coût du prochain niveau d’un entraînement

// ====== Lancer une partie ======
function showLevels(cls) { // étape de choix du niveau, après le choix de la classe
  show("<h2>Choisis ton niveau</h2><p>Chaque niveau a ses dangers et ses richesses. Ta puissance : <b>" + puissance() + "</b>.</p>");
  const card = ov.firstChild;
  for (const [k, L] of Object.entries(LEVELS)) {
    const needP = L.power || 0, okP = puissance() >= needP, open = levelOpen(L);
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = "<b></b><span></span>"; b.disabled = !open;
    b.firstChild.textContent = L.n + (open ? "" : " (verrouillé)");
    b.lastChild.textContent = open ? L.d : (!okP ? "Puissance requise : " + needP + " (la tienne : " + puissance() + "). Améliore ton personnage en ville : Endurance à la Maison, Entraînement à l’Auberge." : L.hint);
    if (open) b.onclick = () => startGame(cls, k);
    card.appendChild(b);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = leaveTown;
  card.appendChild(back);
}
function play() { if (has("taverne")) showClasses(); else showLevels("base"); }
async function startGame(cls, lvl) { // lvl = clé du niveau (forêt par défaut)
  const lvKey = LEVELS[lvl] ? lvl : "lisiere";
  try { await loadCity(); } catch (e) {} // état du camp à jour
  let graves = []; try { graves = await sb("/graves?select=*&level=eq." + lvKey); } catch (e) {} // tombes des joueurs morts
  newGame(); g.state = "play"; ov.hidden = true; g.graves = graves; g.lvKey = lvKey; g.lv = LEVELS[lvKey];
  g.lootOn = has("armurerie"); g.cls = CLASSES[cls] ? cls : "base";
  g.p.max += 10 * (town.maison || 0); // Maison : endurance
  g.w.dmg *= 1 + 0.08 * (town.entrainement || 0); // Auberge : entraînement
  g.spellMul = 1 + 0.08 * (town.entrainement || 0); // les sorts profitent aussi de l’entraînement et des équipements
  if (CLASSES[cls]) {
    applyClass(cls);
    if (town.up_taverne) for (const T of TALENTS[cls]) T.f(g, ((stats.talents || {})[cls] || {})[T.id] || 0);
  }
  if (g.lootOn) { // bonus des équipements portés
    const eq = stats.equip || {};
    for (const it of inv) if (eq[it.kind] === it.id) {
      const v = it.data.val, t = it.data.st;
      if (t === "dmg") { g.w.dmg *= 1 + v / 100; g.spellMul *= 1 + v / 100; }
      else if (t === "hp") g.p.max += v;
      else if (t === "speed") g.p.speed *= 1 + v / 100;
      else if (t === "mag") g.p.mag += v;
      if (it.data.fx && EFFECTS[it.data.fx]) EFFECTS[it.data.fx].f(g, it.data.fl || 1); // pouvoir spécial de l’objet
    }
  }
  g.p.hp = g.p.max;
  g.ammo = ({ guerrier: 30, archer: 45, mage: 35 }[g.cls] || 40) + 5 * (town.arsenal || 0); // munitions de départ : classe + Arsenal // munitions de départ selon la classe
  genWorld();
  g.msg = "Récolte des éclats, puis reviens à la sortie !"; g.msgC = "#ffd36b"; g.msgT = 5;
}

// ====== Écrans de niveau et de fin de partie ======
function showOver() {

  show("<h2>" + (ok ? "Évacuation réussie !" : "Tu es tombé…") + "</h2><p>" + (ok ? "Tu rentres au camp avec ton butin." : "Tu perds tout ton butin et ton équipement porté.") +
    " Durée : " + fmt(g.t) + ", " + g.kills + " victimes.</p>" +
    "<p>Éclats de lune : <b>" + g.run + "</b>" + (ok ? " (réserve : " + bank + ")" : " perdus") +
    (g.runF ? "<br>Fragments de boss : <b>" + g.runF + "</b>" + (ok ? " (total : " + frag + ")" : " perdus") : "") + "</p>" +
    (g.lootOn ? "<p>Équipements trouvés : " + (g.found.length ? names + (ok ? "" : " (perdus)") : "aucun") + ".</p>" : "") +
    (!ok && g.lost.length ? "<p>Équipement perdu : " + g.lost.map(it => it.data.name).join(", ") + ".</p>" : "") +
    (g.unlockedNow ? "<p><b>Niveau débloqué : la ville en ruines !</b> Tu pourras la choisir au prochain départ.</p>" : "") +
    (!ok && g.tomb ? "<p>Ta tombe est apparue là où tu es tombé. Si un joueur reste dessus quelques secondes, tu récupères un de tes équipements perdus.</p>" : "") +

function townSVG(nb, showSite) {
  const trees = [[22, 48], [378, 44], [352, 232], [34, 236], [150, 34], [262, 36], [12, 140], [390, 150]];

  for (const [x, y] of trees) s += '<rect x="' + (x - 2) + '" y="' + (y + 18) + '" width="4" height="8" fill="#3a2a1c"/><path d="M' + x + ' ' + (y - 6) + 'l-12 26h24z" fill="#1b3a2a"/>';

  for (const { B, i } of vis.sort((a, b) => a.B.y - b.B.y)) {

let townData = { names: {} }, townSel = null;
const leaveTown = () => (g.state === "over" ? showOver() : showMenu());

async function showTown() { // charge l’état partagé du camp, puis dessine la carte
  show("<h2>La ville</h2><p>Chargement…</p>");
  try { await loadCity(); } catch (e) {}
  const names = {};
  try { for (const pl of await sb("/players?select=id,name")) names[pl.id] = pl.name; } catch (e) {}
  townData = { names }; renderTown();
}
function renderTown() {
  const names = townData.names, cs = cityState(), nb = cs.nb;
  if (!townSel) townSel = BUILDINGS[0].k;
  show("<h2>La ville</h2>" + townSVG(nb, !!cityRow && !!cs.next) + "<p>Éclats de lune : <b>" + bank + "</b> · Fragments de boss : <b>" + frag + "</b> · Puissance : <b>" + puissance() + "</b>. Touche un bâtiment pour voir sa fiche.</p>");
  const card = ov.firstChild; card.classList.add("wide");
  card.querySelectorAll("[data-k]").forEach(el => {
    const pick = () => { townSel = el.dataset.k; renderTown(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });
  const boxStyle = "border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px";

  const idx = BUILDINGS.findIndex(x => x.k === townSel);
  if (idx >= 0 && idx <= nb) { // fiche du bâtiment choisi
    const B = BUILDINGS[idx];
    const panel = document.createElement("div"); panel.style.cssText = boxStyle;
    panel.innerHTML = "<b>" + B.n + "</b><p style='margin:6px 0 10px'>" + B.d + "</p>";
    const add = (label, on, disabled, alt) => {
      const b = document.createElement("button");
      b.textContent = label; if (alt) b.className = "alt"; b.disabled = !!disabled; b.style.cssText = "margin:0 6px 6px 0"; b.onclick = on;
      panel.appendChild(b);
    };
    if (B.track) { // entraînement permanent du personnage, payé en éclats de lune
      const T = B.track, lv = town[T.key] || 0, full = lv >= T.max, cost = trackCost(T, lv);
      add(full ? T.n + " : niveau maximum" : "Améliorer " + T.n + " (niv. " + lv + "/" + T.max + ") – " + cost + " éclats", () => { bank -= cost; town[T.key] = lv + 1; saveRemote(true); renderTown(); }, full || bank < cost);
    }
    if (B.k === "armurerie") add("Ouvrir l’équipement", () => showEquip(showTown), false, true);
    if (B.k === "taverne" && town.up_taverne) add("Arbres de talents", () => showTalents(), false, true);
    if (B.up) {
      if (town[B.up.key]) panel.insertAdjacentHTML("beforeend", "<p style='margin:6px 0 0'>✓ Améliorée : " + B.up.d + "</p>");
      else {
        add("Améliorer – " + B.up.frag + " fragment" + (B.up.frag > 1 ? "s" : "") + " de boss", () => { frag -= B.up.frag; town[B.up.key] = 1; saveRemote(true); renderTown(); }, frag < B.up.frag);
        panel.insertAdjacentHTML("beforeend", "<p style='margin:6px 0 0;font-size:.9rem'>Amélioration : " + B.up.d + " Les fragments de boss sont lâchés par les boss.</p>");
      }
    }
    card.appendChild(panel);
  }

  const box = document.createElement("div"); box.style.cssText = boxStyle;
  if (!cityRow) { // table city absente ou injoignable
    box.innerHTML = "<b>Chantier commun indisponible</b><p style='margin:6px 0 0'>La base de données ne répond pas pour le camp.</p>";
    card.appendChild(box);
  } else if (cs.next) { // chantier commun : le prochain bâtiment
    const next = cs.next, need = next.cost - cs.have;
    box.innerHTML = "<b>Chantier commun : " + next.n + "</b><p style='margin:6px 0'>" + cs.have + " / " + next.cost + " éclats. Chacun peut donner autant qu’il veut." + mecenes(names) + "</p>" +
      "<div style='height:8px;background:var(--line);border-radius:4px;margin-bottom:10px'><div style='height:8px;width:" + Math.round(100 * cs.have / next.cost) + "%;background:var(--accent);border-radius:4px'></div></div>";
    for (const n of [...[5, 25].filter(v => v < need), need]) {
      const amount = Math.min(n, bank, cs.left);
      const b = document.createElement("button");
      b.className = "alt"; b.style.cssText = "margin:0 6px 6px 0";
      b.textContent = n === need ? "Compléter (" + Math.min(need, bank) + ")" : "Donner " + n;
      b.disabled = amount <= 0 || (n !== need && bank < n);
      b.onclick = async () => {
        try {
          await saveRemote(true); // envoie d’abord les éclats ramassés
          const res = await sb("/rpc/donate", "POST", { p_player: me, p_amount: amount });
          bank -= res.given;
        } catch (e) { return showError(showTown); }
        showTown();
      };
      box.appendChild(b);
    }
    card.appendChild(box);
  } else {
    box.innerHTML = "<b>Le camp est complet !</b><p style='margin:6px 0 0'>Merci à tous." + mecenes(names) + "</p>";
    card.appendChild(box);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = leaveTown;
  card.appendChild(back);
  const dbg = document.createElement("button"); // DEBUG temporaire
  dbg.textContent = "Debug"; dbg.className = "alt"; dbg.style.marginLeft = "6px"; dbg.onclick = showDebug;
  card.appendChild(dbg);
}

// ====== Équipement : choisir ce qu’on porte, et détruire ce dont on ne veut plus ======
let delPending = null;
async function destroyItem(it, from) {
  try { await sb("/items?id=eq." + it.id, "DELETE"); } catch (e) { return showError(() => showEquip(from)); }
  inv = inv.filter(x => x.id !== it.id);
  if (stats.equip && stats.equip[it.kind] === it.id) delete stats.equip[it.kind];
  bank += RECYCLE[it.data.r]; delPending = null; saveRemote(true); showEquip(from);
}
async function showEquip(from) { // from : écran où revenir (la ville) ; sinon menu ou fin de partie
  await lootP;
  const eq = stats.equip || (stats.equip = {});
  const worn = Object.keys(SLOTS).map(k => { const it = inv.find(x => x.id === eq[k]); return SLOTS[k].l + " : " + (it ? it.data.name : "vide"); }).join(" · ");
  show("<h2>Équipement</h2><p>Les bonus s’appliquent à la prochaine partie.</p><p style='font-size:.9rem'></p>");
  const card = ov.firstChild;
  card.querySelector("p:last-child").textContent = worn;
  if (!inv.length) card.insertAdjacentHTML("beforeend", "<p>Aucun équipement pour l’instant : ils tombent des ennemis et des boss.</p>");
  for (const it of inv.slice().sort((a, b) => RAR[b.data.r].ord - RAR[a.data.r].ord || a.kind.localeCompare(b.kind))) {
    const on = eq[it.kind] === it.id, R = RAR[it.data.r], S = SLOTS[it.kind];
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:6px;margin-bottom:8px";
    const b = document.createElement("button");
    b.className = "opt"; b.style.cssText = "margin:0;flex:1;width:auto;border-left:6px solid " + R.c;
    b.innerHTML = "<b></b><span></span>";
    b.firstChild.textContent = (on ? "✓ " : "") + it.data.name;
    b.lastChild.textContent = R.n + " · " + S.l + " · +" + it.data.val + S.u + (it.data.fx && EFFECTS[it.data.fx] ? " · ✦ " + EFFECTS[it.data.fx].n + " (" + EFFECTS[it.data.fx].d + ")" : "") + (on ? " (porté : cliquer pour retirer)" : "");
    b.onclick = () => { if (on) delete eq[it.kind]; else eq[it.kind] = it.id; saveRemote(true); showEquip(from); };
    row.appendChild(b);
    if (town.up_armurerie) { // recyclage débloqué par l’amélioration de l’armurerie
      const d = document.createElement("button");
      d.className = "alt"; d.textContent = delPending === it.id ? "Confirmer (+" + RECYCLE[it.data.r] + ")" : "Détruire (+" + RECYCLE[it.data.r] + ")";
      d.onclick = () => { if (delPending === it.id) destroyItem(it, from); else { delPending = it.id; showEquip(from); } };
      row.appendChild(d);
    }
    card.appendChild(row);
  }
  const back = document.createElement("button");
  back.textContent = "Retour"; back.onclick = typeof from === "function" ? from : leaveTown;
  card.appendChild(back);
}

// ====== DEBUG (temporaire) : bouton « Debug » dans la ville, à supprimer plus tard ======
let dbgPending = "", dbgMsg = "";
const dbgDone = () => { saveRemote(true); showDebug(); };
async function dbgItem(r, power) { // ajoute un équipement de la rareté r (avec un pouvoir si power)
  const it = makeItem(r, power);
  try { inv.push(...await sb("/items", "POST", [{ player_id: me, kind: it.kind, data: { r: it.r, st: it.st, val: it.val, name: it.name, fx: it.fx, fl: it.fl } }], "return=representation")); dbgMsg = "Ajouté : " + it.name; }
  catch (e) { dbgMsg = "Erreur : équipement non ajouté."; }
  showDebug();
}
async function dbgCamp(mode) { // camp partagé : 'full' = tout construire, 'reset' = zéro + tombes vidées (fonction SQL debug_camp)
  try { await sb("/rpc/debug_camp", "POST", { p_mode: mode }); await loadCity(); dbgMsg = mode === "full" ? "Tous les bâtiments sont construits." : "Camp et tombes remis à zéro."; }
  catch (e) { dbgMsg = "Fonction SQL debug_camp absente : lance le SQL fourni."; }
  showDebug();
}
async function dbgReset(all) { // efface la sauvegarde du joueur ; all = aussi le camp partagé et les tombes. Deux clics pour confirmer.
  const key = all ? "all" : "me";
  if (dbgPending !== key) { dbgPending = key; return showDebug(); }
  dbgPending = "";
  try { await sb("/items?player_id=eq." + me, "DELETE"); } catch (e) { return showError(showDebug); }
  bank = 0; frag = 0; inv = []; town = { maison: 0 }; stats = {}; await saveRemote(true);
  dbgMsg = "Ta sauvegarde est effacée.";
  if (all) {
    try { await sb("/rpc/debug_camp", "POST", { p_mode: "reset" }); await loadCity(); dbgMsg += " Camp et tombes remis à zéro."; }
    catch (e) { dbgMsg += " Camp non modifié : fonction SQL debug_camp absente."; }
  }
  showDebug();
}

  add("+1 peu commun avec pouvoir", () => dbgItem(4, true));
  group("Progression");
  add("Tout débloquer (ville, classes, améliorations)", () => { Object.assign(town, { lvl_ville: 1, cl_archer: 1, cl_mage: 1, up_armurerie: 1, up_taverne: 1, up_survie: 1, maison: Math.max(town.maison || 0, 4), entrainement: Math.max(town.entrainement || 0, 4) }); dbgMsg = "Ville, classes, améliorations débloquées et Puissance 8 atteinte (forêt ouverte)."; dbgDone(); });
  add("+1 niveau à chaque entraînement", () => { for (const [k, m] of [["maison", 10], ["entrainement", 10], ["arsenal", 8]]) town[k] = Math.min(m, (town[k] || 0) + 1); dbgMsg = "Puissance : " + puissance(); dbgDone(); });
  group("Camp partagé (SQL requis)");
  add("Tout construire", () => dbgCamp("full"));
  add("Remettre à zéro + vider les tombes", () => dbgCamp("reset"));
  group("Remise à zéro");
  add(dbgPending === "me" ? "Confirmer : effacer ma sauvegarde" : "Effacer ma sauvegarde", () => dbgReset(false), true);
  add(dbgPending === "all" ? "Confirmer : TOUT remettre à zéro" : "TOUT remettre à zéro (moi + camp + tombes)", () => dbgReset(true), true);
  add("Retour à la ville", () => { dbgPending = ""; dbgMsg = ""; showTown(); }, true);
}

// ====== Boucle principale ======
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (g.state === "play") update(dt);
  draw();
  requestAnimationFrame(loop);
}
newGame();
(async function start() {
  show("<h1>Veillée</h1><p>Chargement…</p>");
  let last0 = NaN; try { last0 = parseInt(localStorage.getItem("veillee_dernier")); } catch (e) {}
  if (last0 >= 0) { try { await loadProfile(last0); showMenu(); return; } catch (e) {} }
  showProfiles();
})();
requestAnimationFrame(loop);
</script>
